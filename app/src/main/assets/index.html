es"],"Поверхностей с каркасом":["Surfaces with frame","Flächen mit Rahmen","Surfaces avec ossature","Superficies con estructura"],"Поверхности":["Surfaces","Flächen","Surfaces","Superficies"],"Поворот налево":["Turn left","Linksabbiegung","Virage à gauche","Giro a la izquierda"],"Поворот направо":["Turn right","Rechtsabbiegung","Virage à droite","Giro a la derecha"],"Показать все":["Show all","Alles zeigen","Tout afficher","Mostrar todo"],"Пол":["Floor","Boden","Sol","Suelo"],"Поликарбонат":["Polycarbonate","Polycarbonat","Polycarbonate","Policarbonato"],"Положение в развёртке":["Position in the flat view","Position in der Abwicklung","Position dans le développé","Posición en el desarrollo"],"Положение проёмов, расстояние до краёв":["Opening positions, distance to the edges","Lage der Öffnungen, Abstand zu den Rändern","Position des ouvertures, distance aux bords","Posición de los huecos, distancia a los bordes"],"После добавления материал раскроется в списке: там задаются текстура, цвет и размеры.":["After adding, the material expands in the list: that is where texture, colour and sizes are set.","Nach dem Hinzufügen klappt das Material in der Liste auf: Dort werden Textur, Farbe und Maße festgelegt.","Après l’ajout, le matériau se déploie dans la liste : on y règle texture, couleur et dimensions.","Tras añadirlo, el material se despliega en la lista: allí se fijan textura, color y medidas."],"Потолок":["Ceiling","Decke","Plafond","Techo"],"Потяните саму поверхность":["Drag the surface itself","Ziehen Sie die Fläche selbst","Faites glisser la surface elle-même","Arrastre la propia superficie"],"Пропил, мм":["Kerf, mm","Schnittfuge, mm","Trait de scie, mm","Corte (sierra), mm"],"Профили каркаса":["Frame profiles","Rahmenprofile","Profilés de l’ossature","Perfiles de la estructura"],"Профили у краёв стены":["Profiles at the wall edges","Profile an den Wandrändern","Profilés aux bords du mur","Perfiles en los bordes de la pared"],"Профиль":["Profile","Profil","Profilé","Perfil"],"Профиль (длина)":["Profile (length)","Profil (Länge)","Profilé (longueur)","Perfil (longitud)"],"Профиль для ГКЛ":["Profile for plasterboard","Profil für Gipskarton","Profilé pour plaques de plâtre","Perfil para cartón yeso"],"Профиль каркаса":["Frame profile","Rahmenprofil","Profilé d’ossature","Perfil de la estructura"],"Профиль каркаса:":["Frame profile:","Rahmenprofil:","Profilé d’ossature :","Perfil de la estructura:"],"Профиль считается для поверхностей, где включён каркас. В проёмах профиль обрезается: остатки идут в следующие куски. Шаг можно задать для каждой поверхности отдельно.":["The profile is counted for surfaces where the frame is on. At openings the profile is cut and the offcuts go into the next pieces. The spacing can be set for each surface separately.","Das Profil wird für Flächen gezählt, bei denen der Rahmen aktiviert ist. An Öffnungen wird es gekürzt, die Reste gehen in die nächsten Stücke. Der Abstand lässt sich für jede Fläche einzeln festlegen.","Le profilé est compté pour les surfaces où l’ossature est activée. Aux ouvertures il est coupé et les chutes servent aux pièces suivantes. L’entraxe peut être réglé pour chaque surface.","El perfil se cuenta en las superficies con estructura activada. En los huecos se corta y los sobrantes pasan a las piezas siguientes. La separación se puede fijar para cada superficie."],"Профильная труба":["Profile tube","Profilrohr","Tube profilé","Tubo perfilado"],"Проём":["Opening","Öffnung","Ouverture","Hueco"],"Проёмов":["Openings","Öffnungen","Ouvertures","Huecos"],"Проёмов нет. Добавьте дверь или окно в карточке поверхности.":["No openings. Add a door or window in the surface card.","Keine Öffnungen. Fügen Sie in der Flächenkarte eine Tür oder ein Fenster hinzu.","Aucune ouverture. Ajoutez une porte ou une fenêtre dans la fiche de la surface.","Sin huecos. Añada una puerta o ventana en la ficha de la superficie."],"Проёмы":["Openings","Öffnungen","Ouvertures","Huecos"],"Прямо, продолжение стены":["Straight, continuing the wall","Geradeaus, Fortsetzung der Wand","Tout droit, prolongement du mur","Recto, continuación de la pared"],"Прямоугольник":["Rectangle","Rechteck","Rectangle","Rectángulo"],"Рабочая область":["Work area","Arbeitsbereich","Zone de travail","Área de trabajo"],"Развернуть все":["Expand all","Alle ausklappen","Tout développer","Expandir todo"],"Развёртка":["Flat view","Abwicklung","Développé","Desarrollo"],"Размер":["Size","Größe","Taille","Tamaño"],"Размер клетки":["Cell size","Rastergröße","Taille de la maille","Tamaño de la cuadrícula"],"Размер материала":["Material size","Materialgröße","Taille du matériau","Tamaño del material"],"Раскладка":["Layout","Verlegung","Calepinage","Colocación"],"Раскладка вручную":["Manual layout","Manuelle Verlegung","Calepinage manuel","Colocación manual"],"Раскрыть все":["Expand all","Alle aufklappen","Tout déplier","Desplegar todo"],"Расставить профили вручную":["Place profiles manually","Profile manuell setzen","Placer les profilés manuellement","Colocar perfiles manualmente"],"Рассчитайте раскрой и добавьте результат сюда.":["Calculate the cutting and add the result here.","Berechnen Sie den Zuschnitt und fügen Sie das Ergebnis hier hinzu.","Calculez la découpe et ajoutez le résultat ici.","Calcule el corte y añada aquí el resultado."],"Резервная копия":["Backup","Sicherung","Sauvegarde","Copia de seguridad"],"Результат":["Result","Ergebnis","Résultat","Resultado"],"Сбросить":["Reset","Zurücksetzen","Réinitialiser","Restablecer"],"Сбросить сдвиг":["Reset shift","Verschiebung zurücksetzen","Réinitialiser le décalage","Restablecer desplazamiento"],"Свернуть все":["Collapse all","Alle einklappen","Tout replier","Contraer todo"],"Свой материал":["Own material","Eigenes Material","Matériau personnalisé","Material propio"],"Сечение (по желанию)":["Cross-section (optional)","Querschnitt (optional)","Section (facultatif)","Sección (opcional)"],"Скопировать список":["Copy the list","Liste kopieren","Copier la liste","Copiar la lista"],"Слева номера стен: нажмите на номер, справа откроются данные этой стены. Каждая следующая стена продолжается от конца предыдущей: прямо, с поворотом направо или налево под прямым углом. Когда стены замкнуты, пол и потолок принимают их форму. Отдельную стену или перегородку отметьте как «Отдельная стена»: на общем виде её нет, она есть в развёртке.":["Wall numbers are on the left: tap a number and the data of that wall opens on the right. Each next wall continues from the end of the previous one: straight, or turning right or left at a right angle. When the walls are closed, the floor and ceiling take their shape. Mark a single wall or partition as “Separate wall”: it is not in the overall view but is in the flat view.","Links stehen die Wandnummern: Tippen Sie auf eine Nummer, rechts öffnen sich die Daten dieser Wand. Jede weitere Wand setzt am Ende der vorherigen an: geradeaus oder mit Rechts- oder Linksknick im rechten Winkel. Sind die Wände geschlossen, übernehmen Boden und Decke ihre Form. Eine einzelne Wand oder Trennwand markieren Sie als „Einzelne Wand“: In der Gesamtansicht fehlt sie, in der Abwicklung ist sie vorhanden.","À gauche, les numéros de murs : touchez un numéro, les données de ce mur s’ouvrent à droite. Chaque mur suit la fin du précédent : tout droit, ou avec un virage à droite ou à gauche à angle droit. Quand les murs sont fermés, le sol et le plafond prennent leur forme. Marquez un mur isolé ou une cloison comme « Mur indépendant » : il n’apparaît pas sur la vue d’ensemble mais figure dans le développé.","A la izquierda están los números de pared: pulse uno y a la derecha se abren los datos de esa pared. Cada pared siguiente continúa desde el final de la anterior: recto, o girando a derecha o izquierda en ángulo recto. Cuando las paredes se cierran, el suelo y el techo toman su forma. Marque una pared suelta o tabique como «Pared independiente»: no aparece en la vista general, pero sí en el desarrollo."],"Слоёв":["Layers","Lagen","Couches","Capas"],"Создать комнату":["Create room","Raum erstellen","Créer la pièce","Crear estancia"],"Сохраняются стены, пол, потолок, проёмы и их положение, материалы, раскладка и каркас. Сохранить комнату можно значком дискеты в списке комнат на вкладке «Площадь».":["Walls, floor, ceiling, openings and their positions, materials, layout and frame are saved. You can save a room with the floppy icon in the room list on the “Area” tab.","Gespeichert werden Wände, Boden, Decke, Öffnungen und ihre Lage, Materialien, Verlegung und Rahmen. Einen Raum speichern Sie mit dem Disketten-Symbol in der Raumliste auf der Registerkarte „Fläche“.","Sont enregistrés les murs, le sol, le plafond, les ouvertures et leur position, les matériaux, le calepinage et l’ossature. Vous enregistrez une pièce avec l’icône de disquette dans la liste des pièces de l’onglet « Surface ».","Se guardan paredes, suelo, techo, huecos y su posición, materiales, colocación y estructura. Puede guardar una estancia con el icono del disquete en la lista de estancias de la pestaña «Superficie»."],"Сохранённых помещений пока нет. Постройте комнату на вкладке «Площадь» и нажмите «Сохранить в библиотеку».":["There are no saved rooms yet. Build a room on the “Area” tab and press “Save to library”.","Noch keine gespeicherten Räume. Erstellen Sie einen Raum auf der Registerkarte „Fläche“ und tippen Sie auf „In Bibliothek speichern“.","Aucune pièce enregistrée pour l’instant. Construisez une pièce dans l’onglet « Surface » et appuyez sur « Enregistrer dans la bibliothèque ».","Aún no hay estancias guardadas. Construya una en la pestaña «Superficie» y pulse «Guardar en la biblioteca»."],"Стены":["Walls","Wände","Murs","Paredes"],"Стены, пол и потолок":["Walls, floor and ceiling","Wände, Boden und Decke","Murs, sol et plafond","Paredes, suelo y techo"],"Стоек и профилей":["Studs and profiles","Ständer und Profile","Montants et profilés","Montantes y perfiles"],"Стоек обрезано проёмами":["Studs cut by openings","Ständer durch Öffnungen gekürzt","Montants coupés par les ouvertures","Montantes cortados por huecos"],"Стоит автоматически. Введите число или перетащите проём.":["Placed automatically. Enter a number or drag the opening.","Automatisch platziert. Geben Sie eine Zahl ein oder ziehen Sie die Öffnung.","Placé automatiquement. Saisissez un nombre ou faites glisser l’ouverture.","Colocado automáticamente. Introduzca un número o arrastre el hueco."],"Схема комнаты":["Room plan","Raumgrundriss","Plan de la pièce","Esquema de la estancia"],"Схема раскроя":["Cutting diagram","Zuschnittplan","Schéma de découpe","Esquema de corte"],"Считать листы":["Count sheets","Platten zählen","Compter les plaques","Contar planchas"],"Текстура":["Texture","Textur","Texture","Textura"],"Тип проёма":["Opening type","Öffnungstyp","Type d’ouverture","Tipo de hueco"],"Толщина (по желанию)":["Thickness (optional)","Dicke (optional)","Épaisseur (facultatif)","Grosor (opcional)"],"Уголок":["Angle","Winkel","Cornière","Ángulo"],"Удалить все":["Delete all","Alle löschen","Tout supprimer","Eliminar todo"],"Удалить материал":["Delete material","Material löschen","Supprimer le matériau","Eliminar material"],"Уже в библиотеке":["Already in the library","Bereits in der Bibliothek","Déjà dans la bibliothèque","Ya está en la biblioteca"],"Укажите размеры прямоугольной комнаты: четыре стены, пол и потолок появятся на вкладке «Площадь». Двери, окна и материал можно добавить там.":["Enter the size of a rectangular room: four walls, floor and ceiling will appear on the “Area” tab. Doors, windows and material can be added there.","Geben Sie die Maße eines rechteckigen Raums ein: Vier Wände, Boden und Decke erscheinen auf der Registerkarte „Fläche“. Türen, Fenster und Material fügen Sie dort hinzu.","Indiquez les dimensions d’une pièce rectangulaire : quatre murs, le sol et le plafond apparaîtront dans l’onglet « Surface ». Portes, fenêtres et matériau s’y ajoutent.","Indique las medidas de una estancia rectangular: cuatro paredes, suelo y techo aparecerán en la pestaña «Superficie». Allí podrá añadir puertas, ventanas y material."],"Форма":["Shape","Form","Forme","Forma"],"Цвет":["Colour","Farbe","Couleur","Color"],"Чем покрыть":["Cover with","Womit beplanken","Revêtir avec","Con qué cubrir"],"каркас не включён":["frame is off","Rahmen nicht aktiv","ossature désactivée","estructura desactivada"],"керамика":["ceramic","Keramik","céramique","cerámica"],"керамогранит":["porcelain stoneware","Feinsteinzeug","grès cérame","gres porcelánico"],"лист":["sheet","Platte","plaque","plancha"],"пол":["floor","Boden","sol","suelo"],"потолок":["ceiling","Decke","plafond","techo"],"стена":["wall","Wand","mur","pared"],"Стена":["Wall","Wand","Mur","Pared"],"не считается":["not counted","wird nicht gezählt","non compté","no se cuenta"],"Высота листа, мм":["Sheet height, mm","Plattenhöhe, mm","Hauteur de la plaque, mm","Alto de la plancha, mm"],"Высота стен, мм":["Wall height, mm","Wandhöhe, mm","Hauteur des murs, mm","Altura de paredes, mm"],"Высота, мм":["Height, mm","Höhe, mm","Hauteur, mm","Alto, mm"],"Длина профиля, мм":["Profile length, mm","Profillänge, mm","Longueur du profilé, mm","Longitud del perfil, mm"],"Длина, мм":["Length, mm","Länge, mm","Longueur, mm","Largo, mm"],"До потолка, мм":["To ceiling, mm","Bis zur Decke, mm","Jusqu’au plafond, mm","Hasta el techo, mm"],"Куски короче, мм, не считать":["Ignore pieces shorter than, mm","Stücke kürzer als, mm, nicht zählen","Ne pas compter les morceaux plus courts que, mm","No contar trozos más cortos que, mm"],"От пола, мм":["From the floor, mm","Vom Boden, mm","Du sol, mm","Desde el suelo, mm"],"Сдвиг по высоте, мм":["Shift along height, mm","Verschiebung in der Höhe, mm","Décalage en hauteur, mm","Desplazamiento en altura, mm"],"Сдвиг по длине, мм":["Shift along length, mm","Verschiebung in der Länge, mm","Décalage en longueur, mm","Desplazamiento en largo, mm"],"Сдвиг по ширине, мм":["Shift along width, mm","Verschiebung in der Breite, mm","Décalage en largeur, mm","Desplazamiento en ancho, mm"],"Слева, мм":["Left, mm","Links, mm","Gauche, mm","Izquierda, mm"],"Справа, мм":["Right, mm","Rechts, mm","Droite, mm","Derecha, mm"],"Шаг между профилями, мм":["Spacing between profiles, mm","Abstand zwischen Profilen, mm","Entraxe des profilés, mm","Separación entre perfiles, mm"],"Шаг по умолчанию, мм":["Default spacing, mm","Standardabstand, mm","Entraxe par défaut, mm","Separación por defecto, mm"],"Шаг, мм":["Spacing, mm","Abstand, mm","Entraxe, mm","Separación, mm"],"Ширина листа, мм":["Sheet width, mm","Plattenbreite, mm","Largeur de la plaque, mm","Ancho de la plancha, mm"],"Ширина, мм":["Width, mm","Breite, mm","Largeur, mm","Ancho, mm"],"Шов, мм":["Joint, mm","Fuge, mm","Joint, mm","Junta, mm"],"(копия)":["(copy)","(Kopie)","(copie)","(copia)"],"ПП":["CD","CD","CD","CD"],"вертикально":["vertical","vertikal","verticalement","verticalmente"],"горизонтально":["horizontal","horizontal","horizontalement","horizontalmente"],"раскладка":["layout","Verlegung","calepinage","colocación"],"каркас":["frame","Rahmen","ossature","estructura"],"листов":["sheets","Platten","plaques","planchas"],"по длине":["by length","nach Länge","en longueur","por longitud"],"проверьте размеры":["check the sizes","Maße prüfen","vérifiez les dimensions","compruebe las medidas"],"материал не выбран":["no material chosen","kein Material gewählt","aucun matériau choisi","material no elegido"],"остатка нет":["no remainder","kein Rest","pas de reste","sin sobrante"],"В комнате нет стен":["The room has no walls","Der Raum hat keine Wände","La pièce n’a pas de murs","La estancia no tiene paredes"],"В корзине":["In the cart","Im Warenkorb","Dans le panier","En el carrito"],"В корзину":["Add to cart","In den Warenkorb","Ajouter au panier","Al carrito"],"Введите название материала":["Enter the material name","Geben Sie den Materialnamen ein","Saisissez le nom du matériau","Introduzca el nombre del material"],"Все комнаты удалены":["All rooms deleted","Alle Räume gelöscht","Toutes les pièces sont supprimées","Todas las estancias eliminadas"],"Все стандартные материалы уже есть":["All default materials are already there","Alle Standardmaterialien sind schon vorhanden","Tous les matériaux standard sont déjà là","Ya están todos los materiales estándar"],"Выберите листовой материал: фанеру, гипсокартон, ОСБ и другие.":["Choose a sheet material: plywood, plasterboard, OSB and others.","Wählen Sie ein Plattenmaterial: Sperrholz, Gipskarton, OSB und andere.","Choisissez un matériau en plaques : contreplaqué, plaque de plâtre, OSB et autres.","Elija un material en planchas: contrachapado, cartón yeso, OSB y otros."],"Выберите материал":["Choose a material","Wählen Sie ein Material","Choisissez un matériau","Elija un material"],"Выберите профиль для каркаса.":["Choose a profile for the frame.","Wählen Sie ein Profil für den Rahmen.","Choisissez un profilé pour l’ossature.","Elija un perfil para la estructura."],"Данные загружены":["Data loaded","Daten geladen","Données chargées","Datos cargados"],"Данные скопированы":["Data copied","Daten kopiert","Données copiées","Datos copiados"],"Для этого материала нет размеров в библиотеке":["This material has no sizes in the library","Für dieses Material gibt es keine Größen in der Bibliothek","Ce matériau n’a pas de tailles dans la bibliothèque","Este material no tiene tamaños en la biblioteca"],"Добавить профиль":["Add profile","Profil hinzufügen","Ajouter un profilé","Añadir perfil"],"Добавьте профиль или верните стандартные материалы.":["Add a profile or restore the default materials.","Fügen Sie ein Profil hinzu oder stellen Sie die Standardmaterialien wieder her.","Ajoutez un profilé ou rétablissez les matériaux standard.","Añada un perfil o restaure los materiales estándar."],"Добавьте стену слева и укажите её длину и высоту. Следующие стены строятся от конца предыдущей.":["Add the left wall and set its length and height. Each next wall is built from the end of the previous one.","Fügen Sie die linke Wand hinzu und geben Sie Länge und Höhe an. Jede weitere Wand setzt am Ende der vorherigen an.","Ajoutez le mur de gauche et indiquez sa longueur et sa hauteur. Chaque mur suivant part de la fin du précédent.","Añada la pared izquierda e indique su largo y alto. Cada pared siguiente parte del final de la anterior."],"Добавьте стену, пол или потолок и укажите размеры. Длина до 30 м, высота стены до 10 м.":["Add a wall, floor or ceiling and set the sizes. Length up to 30 m, wall height up to 10 m.","Fügen Sie eine Wand, einen Boden oder eine Decke hinzu und geben Sie die Maße an. Länge bis 30 m, Wandhöhe bis 10 m.","Ajoutez un mur, un sol ou un plafond et indiquez les dimensions. Longueur jusqu’à 30 m, hauteur de mur jusqu’à 10 m.","Añada una pared, suelo o techo e indique las medidas. Largo hasta 30 m, altura de pared hasta 10 m."],"Добавьте хотя бы одну деталь: длину и количество.":["Add at least one part: length and quantity.","Fügen Sie mindestens ein Teil hinzu: Länge und Anzahl.","Ajoutez au moins une pièce : longueur et quantité.","Añada al menos una pieza: largo y cantidad."],"Добавьте хотя бы одну деталь: ширину, высоту и количество.":["Add at least one part: width, height and quantity.","Fügen Sie mindestens ein Teil hinzu: Breite, Höhe und Anzahl.","Ajoutez au moins une pièce : largeur, hauteur et quantité.","Añada al menos una pieza: ancho, alto y cantidad."],"Комнат пока нет":["No rooms yet","Noch keine Räume","Pas encore de pièces","Aún no hay estancias"],"Комнат пока нет. Нажмите «Комната», чтобы начать.":["No rooms yet. Press “Room” to start.","Noch keine Räume. Tippen Sie auf „Raum“, um zu beginnen.","Pas encore de pièces. Appuyez sur « Pièce » pour commencer.","Aún no hay estancias. Pulse «Estancia» para empezar."],"Комнат уже слишком много, удалите ненужные":["There are too many rooms already, delete the unneeded ones","Es gibt schon zu viele Räume, löschen Sie nicht benötigte","Il y a déjà trop de pièces, supprimez les inutiles","Ya hay demasiadas estancias, elimine las innecesarias"],"Комната скопирована":["Room copied","Raum kopiert","Pièce copiée","Estancia copiada"],"Комната добавлена:":["Room added:","Raum hinzugefügt:","Pièce ajoutée :","Estancia añadida:"],"Комната создана:":["Room created:","Raum erstellt:","Pièce créée :","Estancia creada:"],"Комната удалена:":["Room deleted:","Raum gelöscht:","Pièce supprimée :","Estancia eliminada:"],"Обновлено в библиотеке помещений:":["Updated in the rooms library:","In der Raumbibliothek aktualisiert:","Mis à jour dans la bibliothèque de pièces :","Actualizado en la biblioteca de estancias:"],"Сохранено в библиотеку помещений:":["Saved to the rooms library:","In der Raumbibliothek gespeichert:","Enregistré dans la bibliothèque de pièces :","Guardado en la biblioteca de estancias:"],"Возвращено материалов:":["Materials restored:","Materialien wiederhergestellt:","Matériaux rétablis :","Materiales restaurados:"],"Контур замкнут. Нажмите «Отменить точку», чтобы продолжить":["The outline is closed. Press “Undo point” to continue","Die Kontur ist geschlossen. Tippen Sie auf „Punkt rückgängig“, um fortzufahren","Le contour est fermé. Appuyez sur « Annuler le point » pour continuer","El contorno está cerrado. Pulse «Deshacer punto» para continuar"],"Контур не замкнут. Нажмите на первую точку или «Замкнуть». Длину линии можно изменить вручную.":["The outline is not closed. Tap the first point or “Close outline”. You can change a line length by hand.","Die Kontur ist nicht geschlossen. Tippen Sie auf den ersten Punkt oder „Kontur schließen“. Die Linienlänge lässt sich von Hand ändern.","Le contour n’est pas fermé. Touchez le premier point ou « Fermer le contour ». La longueur d’une ligne peut être modifiée à la main.","El contorno no está cerrado. Pulse el primer punto o «Cerrar contorno». La longitud de la línea se puede cambiar a mano."],"Корзина обновлена":["Cart updated","Warenkorb aktualisiert","Panier mis à jour","Carrito actualizado"],"Линия не должна пересекать контур":["The line must not cross the outline","Die Linie darf die Kontur nicht kreuzen","La ligne ne doit pas couper le contour","La línea no debe cruzar el contorno"],"Листовых материалов нет":["There are no sheet materials","Keine Plattenmaterialien vorhanden","Aucun matériau en plaques","No hay materiales en planchas"],"Материал добавлен. Текстура и цвет задаются в библиотеке":["Material added. Texture and colour are set in the library","Material hinzugefügt. Textur und Farbe werden in der Bibliothek festgelegt","Matériau ajouté. Texture et couleur se règlent dans la bibliothèque","Material añadido. Textura y color se fijan en la biblioteca"],"Материал добавлен: задайте текстуру, цвет и размеры":["Material added: set the texture, colour and sizes","Material hinzugefügt: Textur, Farbe und Maße festlegen","Matériau ajouté : réglez texture, couleur et dimensions","Material añadido: fije textura, color y medidas"],"Материал удалён из библиотеки":["Material removed from the library","Material aus der Bibliothek entfernt","Matériau retiré de la bibliothèque","Material eliminado de la biblioteca"],"Нажмите ещё раз, чтобы удалить":["Press again to delete","Zum Löschen noch einmal tippen","Appuyez à nouveau pour supprimer","Pulse otra vez para eliminar"],"Не получается замкнуть: линия пересекает контур":["Cannot close: the line crosses the outline","Schließen nicht möglich: Die Linie kreuzt die Kontur","Impossible de fermer : la ligne coupe le contour","No se puede cerrar: la línea cruza el contorno"],"Не удалось прочитать данные":["Could not read the data","Daten konnten nicht gelesen werden","Impossible de lire les données","No se pudieron leer los datos"],"Не удалось скопировать":["Could not copy","Kopieren fehlgeschlagen","Impossible de copier","No se pudo copiar"],"Нечего добавлять в корзину":["Nothing to add to the cart","Nichts zum Hinzufügen zum Warenkorb","Rien à ajouter au panier","Nada que añadir al carrito"],"Нечего считать.":["Nothing to calculate.","Nichts zu berechnen.","Rien à calculer.","Nada que calcular."],"Нужен замкнутый контур с прямыми углами":["A closed outline with right angles is needed","Eine geschlossene Kontur mit rechten Winkeln ist nötig","Un contour fermé à angles droits est nécessaire","Se necesita un contorno cerrado con ángulos rectos"],"Площадь очищена":["Area cleared","Fläche geleert","Surface effacée","Superficie borrada"],"Поверхностей пока нет":["No surfaces yet","Noch keine Flächen","Pas encore de surfaces","Aún no hay superficies"],"Поверхность удалена":["Surface deleted","Fläche gelöscht","Surface supprimée","Superficie eliminada"],"Пока нечего считать":["Nothing to calculate yet","Noch nichts zu berechnen","Rien à calculer pour l’instant","Aún nada que calcular"],"Помещение удалено":["Room deleted","Raum gelöscht","Pièce supprimée","Estancia eliminada"],"Поставить автоматически":["Place automatically","Automatisch setzen","Placer automatiquement","Colocar automáticamente"],"Поставьте хотя бы три угла":["Place at least three corners","Setzen Sie mindestens drei Ecken","Placez au moins trois angles","Coloque al menos tres esquinas"],"Профилей в библиотеке нет":["There are no profiles in the library","Keine Profile in der Bibliothek","Aucun profilé dans la bibliothèque","No hay perfiles en la biblioteca"],"Проём, люк":["Opening, hatch","Öffnung, Luke","Ouverture, trappe","Hueco, trampilla"],"Пруток, арматура":["Rod, rebar","Stab, Bewehrung","Tige, armature","Varilla, armadura"],"Размеры этой поверхности не заданы или слишком большие. Укажите их в карточке слева.":["The sizes of this surface are not set or too large. Set them in the card on the left.","Die Maße dieser Fläche sind nicht gesetzt oder zu groß. Geben Sie sie in der Karte links an.","Les dimensions de cette surface ne sont pas définies ou trop grandes. Indiquez-les dans la fiche à gauche.","Las medidas de esta superficie no están fijadas o son demasiado grandes. Indíquelas en la ficha de la izquierda."],"Сбросить цвет":["Reset colour","Farbe zurücksetzen","Réinitialiser la couleur","Restablecer color"],"Сверху":["From top","Von oben","Du haut","Desde arriba"],"Снизу":["From bottom","Von unten","Du bas","Desde abajo"],"Слева":["Left","Links","Gauche","Izquierda"],"Справа":["Right","Rechts","Droite","Derecha"],"От пола":["From the floor","Vom Boden","Du sol","Desde el suelo"],"До потолка":["To the ceiling","Bis zur Decke","Jusqu’au plafond","Hasta el techo"],"Слишком много комнат":["Too many rooms","Zu viele Räume","Trop de pièces","Demasiadas estancias"],"Слишком много одинаковых проёмов: уменьшите количество":["Too many identical openings: reduce the quantity","Zu viele gleiche Öffnungen: Anzahl verringern","Trop d’ouvertures identiques : réduisez la quantité","Demasiados huecos iguales: reduzca la cantidad"],"Слишком много углов":["Too many corners","Zu viele Ecken","Trop d’angles","Demasiadas esquinas"],"Создайте комнату: в ней вы добавите стены, пол и потолок, проёмы и материал.":["Create a room: there you will add walls, floor and ceiling, openings and material.","Erstellen Sie einen Raum: Dort fügen Sie Wände, Boden und Decke, Öffnungen und Material hinzu.","Créez une pièce : vous y ajouterez murs, sol et plafond, ouvertures et matériau.","Cree una estancia: en ella añadirá paredes, suelo y techo, huecos y material."],"Сохранено в библиотеку":["Saved to the library","In der Bibliothek gespeichert","Enregistré dans la bibliothèque","Guardado en la biblioteca"],"Сохранить в библиотеку":["Save to library","In Bibliothek speichern","Enregistrer dans la bibliothèque","Guardar en la biblioteca"],"Список скопирован":["List copied","Liste kopiert","Liste copiée","Lista copiada"],"Текстуру и цвет материала можно задать на вкладке «Материалы».":["Texture and colour of a material can be set on the “Materials” tab.","Textur und Farbe eines Materials lassen sich auf der Registerkarte „Materialien“ festlegen.","La texture et la couleur d’un matériau se règlent dans l’onglet « Matériaux ».","La textura y el color de un material se fijan en la pestaña «Materiales»."],"Точно удалить?":["Really delete?","Wirklich löschen?","Vraiment supprimer ?","¿Eliminar de verdad?"],"Удалено из корзины":["Removed from the cart","Aus dem Warenkorb entfernt","Retiré du panier","Quitado del carrito"],"Укажите высоту потолков":["Set the ceiling height","Geben Sie die Deckenhöhe an","Indiquez la hauteur sous plafond","Indique la altura de techos"],"Укажите длину материала, и расчёт появится здесь.":["Set the material length and the calculation will appear here.","Geben Sie die Materiallänge an, die Berechnung erscheint dann hier.","Indiquez la longueur du matériau et le calcul apparaîtra ici.","Indique el largo del material y el cálculo aparecerá aquí."],"Укажите длину профиля, не меньше 300 мм.":["Set the profile length, at least 300 mm.","Geben Sie die Profillänge an, mindestens 300 mm.","Indiquez la longueur du profilé, au moins 300 mm.","Indique la longitud del perfil, al menos 300 mm."],"Укажите длину, ширину и высоту стен":["Set the length, width and wall height","Geben Sie Länge, Breite und Wandhöhe an","Indiquez la longueur, la largeur et la hauteur des murs","Indique largo, ancho y altura de las paredes"],"Укажите ширину и высоту листа, и расчёт появится здесь.":["Set the sheet width and height and the calculation will appear here.","Geben Sie Breite und Höhe der Platte an, die Berechnung erscheint dann hier.","Indiquez la largeur et la hauteur de la plaque et le calcul apparaîtra ici.","Indique el ancho y el alto de la plancha y el cálculo aparecerá aquí."],"Этот материал удалён из библиотеки":["This material was removed from the library","Dieses Material wurde aus der Bibliothek entfernt","Ce matériau a été retiré de la bibliothèque","Este material se eliminó de la biblioteca"],"Стены:":["Walls:","Wände:","Murs :","Paredes:"],"Детали:":["Parts:","Teile:","Pièces :","Piezas:"],"Целых:":["Whole:","Ganze:","Entières :","Enteras:"],"Длина стены":["Wall length","Wandlänge","Longueur du mur","Largo de la pared"],"Высота детали":["Part height","Teilhöhe","Hauteur de la pièce","Alto de la pieza"],"м²":["m²","m²","m²","m²"],"шт.":["pcs","Stk.","pcs","uds."],"листа":["sheets","Platten","plaques","planchas"],"профиль":["profile","Profil","profilé","perfil"],"профиля":["profiles","Profile","profilés","perfiles"],"профилей":["profiles","Profile","profilés","perfiles"],"стойка":["stud","Ständer","montant","montante"],"стойки":["studs","Ständer","montants","montantes"],"стоек":["studs","Ständer","montants","montantes"],"поверхность":["surface","Fläche","surface","superficie"],"поверхности":["surfaces","Flächen","surfaces","superficies"],"поверхностей":["surfaces","Flächen","surfaces","superficies"],"комната":["room","Raum","pièce","estancia"],"комнаты":["rooms","Räume","pièces","estancias"],"комнат":["rooms","Räume","pièces","estancias"],"размер":["size","Größe","taille","tamaño"],"размера":["sizes","Größen","tailles","tamaños"],"размеров":["sizes","Größen","tailles","tamaños"],"Длина стены, мм":["Wall length, mm","Wandlänge, mm","Longueur du mur, mm","Largo de la pared, mm"],"Обзор":["Overview","Überblick","Aperçu","Resumen"],"Порядок работы":["Workflow","Arbeitsablauf","Déroulement","Orden de trabajo"],"Сначала создайте комнату, затем на вкладке «Площадь» добавьте проёмы и выберите материал. Посмотрите результат и нажмите «В корзину». Выберите вкладку выше, чтобы узнать о ней подробнее.":["First create a room, then on the “Area” tab add openings and choose a material. Check the result and press “Add to cart”. Pick a tab above to learn more about it.","Legen Sie zuerst einen Raum an, fügen Sie dann auf der Registerkarte „Fläche“ Öffnungen hinzu und wählen Sie ein Material. Prüfen Sie das Ergebnis und tippen Sie auf „In den Warenkorb“. Wählen Sie oben eine Registerkarte, um mehr zu erfahren.","Créez d’abord une pièce, puis dans l’onglet « Surface » ajoutez les ouvertures et choisissez un matériau. Vérifiez le résultat et appuyez sur « Ajouter au panier ». Choisissez un onglet ci-dessus pour en savoir plus.","Primero cree una estancia y luego, en la pestaña «Superficie», añada huecos y elija un material. Compruebe el resultado y pulse «Al carrito». Elija una pestaña arriba para saber más."],"Размеры комнаты":["Room size","Raumgröße","Dimensions de la pièce","Medidas de la estancia"],"Введите длину, ширину и высоту стен, отметьте пол и потолок. Название можно оставить как есть.":["Enter the length, width and wall height and tick floor and ceiling. You can keep the name as it is.","Geben Sie Länge, Breite und Wandhöhe ein und haken Sie Boden und Decke an. Den Namen können Sie so lassen.","Saisissez la longueur, la largeur et la hauteur des murs, cochez sol et plafond. Vous pouvez garder le nom tel quel.","Introduzca largo, ancho y altura de las paredes y marque suelo y techo. Puede dejar el nombre como está."],"Быстрое создание":["Quick creation","Schnell erstellen","Création rapide","Creación rápida"],"Кнопка «ОК, добавить комнату» сразу создаёт четыре стены, пол и потолок на вкладке «Площадь».":["The “OK, add room” button immediately creates four walls, a floor and a ceiling on the “Area” tab.","Die Schaltfläche „OK, Raum hinzufügen“ erstellt sofort vier Wände, Boden und Decke auf der Registerkarte „Fläche“.","Le bouton « OK, ajouter la pièce » crée aussitôt quatre murs, un sol et un plafond dans l’onglet « Surface ».","El botón «OK, añadir estancia» crea al instante cuatro paredes, suelo y techo en la pestaña «Superficie»."],"Ручная настройка":["Manual setup","Manuelle Einrichtung","Configuration manuelle","Configuración manual"],"«Настроить помещение вручную» создаёт пустую комнату: стены, пол и потолок вы добавляете сами.":["“Set up the room manually” creates an empty room: you add the walls, floor and ceiling yourself.","„Raum manuell einrichten“ erstellt einen leeren Raum: Wände, Boden und Decke fügen Sie selbst hinzu.","« Configurer la pièce manuellement » crée une pièce vide : vous ajoutez vous-même murs, sol et plafond.","«Configurar la estancia manualmente» crea una estancia vacía: usted añade las paredes, el suelo y el techo."],"Чертёж схемы":["Drawing a plan","Grundriss zeichnen","Dessiner le plan","Dibujar el esquema"],"«Начертить схему» открывает поле в клетку. Нажимайте на узлы, чтобы ставить углы, и на первую точку, чтобы замкнуть контур. Длину любой стены можно изменить вручную, затем нажмите «Создать комнату».":["“Draw a plan” opens a grid. Tap the nodes to place corners and the first point to close the outline. You can change any wall length by hand, then press “Create room”.","„Grundriss zeichnen“ öffnet ein Raster. Tippen Sie auf Rasterpunkte, um Ecken zu setzen, und auf den ersten Punkt, um die Kontur zu schließen. Jede Wandlänge lässt sich von Hand ändern, danach tippen Sie auf „Raum erstellen“.","« Dessiner un plan » ouvre une grille. Touchez les nœuds pour placer les angles et le premier point pour fermer le contour. Vous pouvez modifier à la main la longueur de chaque mur, puis appuyez sur « Créer la pièce ».","«Dibujar esquema» abre una cuadrícula. Pulse los nodos para colocar esquinas y el primer punto para cerrar el contorno. Puede cambiar a mano el largo de cualquier pared y luego pulsar «Crear estancia»."],"Комнаты и поверхности":["Rooms and surfaces","Räume und Flächen","Pièces et surfaces","Estancias y superficies"],"Слева список комнат, под ним стены, пол и потолок. Выберите поверхность, чтобы открыть её карточку, и добавляйте новые.":["On the left is the list of rooms, below it the walls, floor and ceiling. Pick a surface to open its card, and add new ones.","Links steht die Raumliste, darunter Wände, Boden und Decke. Wählen Sie eine Fläche, um ihre Karte zu öffnen, und fügen Sie neue hinzu.","À gauche la liste des pièces, dessous les murs, le sol et le plafond. Choisissez une surface pour ouvrir sa fiche et ajoutez-en de nouvelles.","A la izquierda está la lista de estancias y debajo las paredes, suelo y techo. Elija una superficie para abrir su ficha y añada nuevas."],"В карточке поверхности добавьте дверь или окно и задайте размеры и положение: числами или перетаскиванием на чертеже.":["In the surface card add a door or window and set its size and position: by numbers or by dragging on the drawing.","Fügen Sie in der Flächenkarte eine Tür oder ein Fenster hinzu und legen Sie Größe und Lage fest: per Zahlen oder durch Ziehen in der Zeichnung.","Dans la fiche de la surface ajoutez une porte ou une fenêtre et réglez taille et position : par chiffres ou en faisant glisser sur le dessin.","En la ficha de la superficie añada una puerta o ventana y fije tamaño y posición: con números o arrastrando en el dibujo."],"Для каждой поверхности выберите свой материал: гипсокартон, плитку, фанеру и другие. Где материал не выбран, берётся основной.":["Choose your own material for each surface: plasterboard, tile, plywood and others. Where none is chosen, the main one is used.","Wählen Sie für jede Fläche ein eigenes Material: Gipskarton, Fliesen, Sperrholz und andere. Wo keines gewählt ist, gilt das Hauptmaterial.","Choisissez un matériau pour chaque surface : plaques de plâtre, carrelage, contreplaqué et autres. Sans choix, le matériau principal est utilisé.","Elija un material para cada superficie: cartón yeso, baldosas, contrachapado y otros. Donde no se elija ninguno se usa el principal."],"Вся комната в объёме. Её можно поворачивать ползунком, кнопками или мышью. Нажмите на стену или пол, чтобы открыть её в развёртке.":["The whole room in 3D. You can rotate it with the slider, the buttons or the mouse. Tap a wall or the floor to open it in the flat view.","Der ganze Raum räumlich. Sie können ihn mit dem Regler, den Tasten oder der Maus drehen. Tippen Sie auf eine Wand oder den Boden, um sie in der Abwicklung zu öffnen.","Toute la pièce en volume. Vous pouvez la faire pivoter avec le curseur, les boutons ou la souris. Touchez un mur ou le sol pour l’ouvrir dans le développé.","Toda la estancia en volumen. Puede girarla con el control deslizante, los botones o el ratón. Pulse una pared o el suelo para abrirlos en el desarrollo."],"Одна поверхность крупно. Перетаскивайте двери, окна и профили, включайте «Раскладка вручную» и двигайте сетку листов или плитки. Над чертежом видно, сколько материала и профиля уходит.":["One surface shown large. Drag doors, windows and profiles, turn on “Manual layout” and move the grid of sheets or tiles. Above the drawing you can see how much material and profile is used.","Eine Fläche groß dargestellt. Ziehen Sie Türen, Fenster und Profile, schalten Sie „Manuelle Verlegung“ ein und verschieben Sie das Raster der Platten oder Fliesen. Über der Zeichnung sehen Sie den Material- und Profilverbrauch.","Une surface en grand. Faites glisser portes, fenêtres et profilés, activez « Calepinage manuel » et déplacez la grille de plaques ou de carreaux. Au-dessus du dessin on voit la consommation de matériau et de profilés.","Una superficie en grande. Arrastre puertas, ventanas y perfiles, active «Colocación manual» y mueva la cuadrícula de planchas o baldosas. Sobre el dibujo se ve cuánto material y perfil se gasta."],"Включите каркас у стены, пола или потолка и задайте шаг. Профили можно расставить вручную и добавить горизонтальные. В проёмах профиль обрезается, остатки идут в следующие куски.":["Turn on the frame for a wall, floor or ceiling and set the spacing. Profiles can be placed by hand and horizontal ones added. At openings the profile is cut and the offcuts go into the next pieces.","Schalten Sie den Rahmen für Wand, Boden oder Decke ein und legen Sie den Abstand fest. Profile lassen sich von Hand setzen, horizontale können ergänzt werden. An Öffnungen werden Profile gekürzt, die Reste gehen in die nächsten Stücke.","Activez l’ossature pour un mur, le sol ou le plafond et réglez l’entraxe. Les profilés peuvent être placés à la main et des horizontaux ajoutés. Aux ouvertures le profilé est coupé et les chutes servent aux pièces suivantes.","Active la estructura en una pared, suelo o techo y fije la separación. Los perfiles se pueden colocar a mano y añadir horizontales. En los huecos el perfil se corta y los sobrantes pasan a las piezas siguientes."],"Внизу итог: сколько листов нужно, остаток и схема раскроя. Выберите расчёт «По площади» или «По раскладке», затем нажмите «В корзину».":["At the bottom is the result: how many sheets are needed, the remainder and the cutting diagram. Choose the “By area” or “By layout” calculation, then press “Add to cart”.","Unten steht das Ergebnis: wie viele Platten nötig sind, der Rest und der Zuschnittplan. Wählen Sie die Berechnung „Nach Fläche“ oder „Nach Verlegung“ und tippen Sie dann auf „In den Warenkorb“.","En bas, le résultat : combien de plaques sont nécessaires, le reste et le schéma de découpe. Choisissez le calcul « Par surface » ou « Par calepinage », puis appuyez sur « Ajouter au panier ».","Abajo está el resultado: cuántas planchas hacen falta, el sobrante y el esquema de corte. Elija el cálculo «Por superficie» o «Por colocación» y pulse «Al carrito»."],"Библиотека материалов":["Materials library","Materialbibliothek","Bibliothèque de matériaux","Biblioteca de materiales"],"Здесь хранятся листовые материалы, плитка, доски и профили: размеры, текстура и цвет. Нажмите на материал, чтобы раскрыть его.":["Sheet materials, tiles, boards and profiles are stored here: sizes, texture and colour. Tap a material to expand it.","Hier werden Plattenmaterialien, Fliesen, Bretter und Profile gespeichert: Maße, Textur und Farbe. Tippen Sie auf ein Material, um es aufzuklappen.","Les matériaux en plaques, carreaux, planches et profilés sont stockés ici : dimensions, texture et couleur. Touchez un matériau pour le déplier.","Aquí se guardan materiales en planchas, baldosas, tablas y perfiles: medidas, textura y color. Pulse un material para desplegarlo."],"«Добавить материал» создаёт новый: укажите название, затем размеры, текстуру и цвет. Остатки одного материала складываются и используются повторно.":["“Add material” creates a new one: set the name, then sizes, texture and colour. Offcuts of one material are combined and reused.","„Material hinzufügen“ legt ein neues an: Name festlegen, dann Maße, Textur und Farbe. Reste desselben Materials werden gesammelt und wiederverwendet.","« Ajouter un matériau » en crée un nouveau : indiquez le nom, puis dimensions, texture et couleur. Les chutes d’un même matériau sont additionnées et réutilisées.","«Añadir material» crea uno nuevo: indique el nombre y luego medidas, textura y color. Los sobrantes de un mismo material se suman y se reutilizan."],"Стандартные материалы":["Default materials","Standardmaterialien","Matériaux standard","Materiales estándar"],"Если что-то удалили, «Вернуть стандартные материалы» возвращает набор по умолчанию.":["If you deleted something, “Restore default materials” brings back the default set.","Wenn Sie etwas gelöscht haben, stellt „Standardmaterialien wiederherstellen“ den Standardsatz wieder her.","Si vous avez supprimé quelque chose, « Rétablir les matériaux standard » ramène l’ensemble par défaut.","Si eliminó algo, «Restaurar materiales estándar» recupera el conjunto por defecto."],"Здесь лежат сохранённые комнаты со всеми параметрами: стенами, проёмами, материалами, раскладкой и каркасом. Сохранить комнату можно значком дискеты на вкладке «Площадь».":["Saved rooms are kept here with all their settings: walls, openings, materials, layout and frame. Save a room with the floppy icon on the “Area” tab.","Hier liegen gespeicherte Räume mit allen Einstellungen: Wände, Öffnungen, Materialien, Verlegung und Rahmen. Einen Raum speichern Sie mit dem Disketten-Symbol auf der Registerkarte „Fläche“.","Les pièces enregistrées sont conservées ici avec tous leurs réglages : murs, ouvertures, matériaux, calepinage et ossature. Enregistrez une pièce avec l’icône de disquette de l’onglet « Surface ».","Aquí están las estancias guardadas con todos sus ajustes: paredes, huecos, materiales, colocación y estructura. Guarde una estancia con el icono del disquete en la pestaña «Superficie»."],"Открыть и удалить":["Open and delete","Öffnen und löschen","Ouvrir et supprimer","Abrir y eliminar"],"Откройте комнату, чтобы продолжить работу с ней на вкладке «Площадь». Лишние комнаты можно удалить.":["Open a room to keep working with it on the “Area” tab. Unneeded rooms can be deleted.","Öffnen Sie einen Raum, um auf der Registerkarte „Fläche“ weiterzuarbeiten. Nicht benötigte Räume lassen sich löschen.","Ouvrez une pièce pour continuer à travailler dessus dans l’onglet « Surface ». Les pièces inutiles peuvent être supprimées.","Abra una estancia para seguir trabajando con ella en la pestaña «Superficie». Las que sobren se pueden eliminar."],"Что режем":["What to cut","Was geschnitten wird","Quoi découper","Qué cortar"],"Выберите материал и укажите его размер: лист, доска, профиль или плитка. Это быстрый расчёт без комнаты.":["Choose the material and set its size: sheet, board, profile or tile. This is a quick calculation without a room.","Wählen Sie das Material und geben Sie seine Größe an: Platte, Brett, Profil oder Fliese. Das ist eine schnelle Berechnung ohne Raum.","Choisissez le matériau et indiquez sa taille : plaque, planche, profilé ou carreau. C’est un calcul rapide sans pièce.","Elija el material e indique su tamaño: plancha, tabla, perfil o baldosa. Es un cálculo rápido sin estancia."],"Детали":["Parts","Teile","Pièces","Piezas"],"Добавьте нужные детали: размеры и количество. Разрешите поворот деталей и задайте пропил и запас.":["Add the parts you need: sizes and quantity. Allow parts to be rotated and set the kerf and reserve.","Fügen Sie die benötigten Teile hinzu: Maße und Anzahl. Erlauben Sie das Drehen der Teile und legen Sie Schnittfuge und Reserve fest.","Ajoutez les pièces voulues : dimensions et quantité. Autorisez la rotation des pièces et réglez le trait de scie et la réserve.","Añada las piezas necesarias: medidas y cantidad. Permita girar las piezas y fije el corte y la reserva."],"Схема раскроя показывает, как резать, сколько листов или профилей купить и сколько останется. «В корзину» сохраняет расчёт.":["The cutting diagram shows how to cut, how many sheets or profiles to buy and how much will be left. “Add to cart” saves the calculation.","Der Zuschnittplan zeigt, wie geschnitten wird, wie viele Platten oder Profile zu kaufen sind und wie viel übrig bleibt. „In den Warenkorb“ speichert die Berechnung.","Le schéma de découpe montre comment couper, combien de plaques ou de profilés acheter et ce qui restera. « Ajouter au panier » enregistre le calcul.","El esquema de corte muestra cómo cortar, cuántas planchas o perfiles comprar y cuánto sobrará. «Al carrito» guarda el cálculo."],"Список покупок":["Shopping list","Einkaufsliste","Liste d’achats","Lista de compra"],"Здесь все добавленные расчёты, а внизу общий итог: что и сколько купить.":["All added calculations are here, and at the bottom is the grand total: what to buy and how much.","Hier stehen alle hinzugefügten Berechnungen, unten die Gesamtsumme: was und wie viel zu kaufen ist.","Tous les calculs ajoutés sont ici, et en bas le total général : quoi acheter et en quelle quantité.","Aquí están todos los cálculos añadidos y abajo el total: qué y cuánto comprar."],"Копирование и очистка":["Copy and clear","Kopieren und leeren","Copier et vider","Copiar y vaciar"],"Скопируйте список, чтобы отправить его или сохранить. «Очистить корзину» убирает всё; кнопка просит подтверждения нажатием ещё раз.":["Copy the list to send or keep it. “Empty the cart” removes everything; the button asks for confirmation with a second press.","Kopieren Sie die Liste, um sie zu senden oder zu sichern. „Warenkorb leeren“ entfernt alles; die Schaltfläche verlangt eine Bestätigung durch erneutes Tippen.","Copiez la liste pour l’envoyer ou la conserver. « Vider le panier » supprime tout ; le bouton demande confirmation par une seconde pression.","Copie la lista para enviarla o guardarla. «Vaciar el carrito» lo quita todo; el botón pide confirmación con una segunda pulsación."],"Далее":["Next","Weiter","Suivant","Siguiente"],"Открыть вкладку":["Open this tab","Registerkarte öffnen","Ouvrir l’onglet","Abrir la pestaña"],"Разделы гайда":["Guide sections","Anleitungsabschnitte","Sections du guide","Secciones de la guía"],"дюйм":["in","Zoll","po","pulg"],"Дуб":["Oak","Eiche","Chêne","Roble"],"Орех":["Walnut","Nuss","Noyer","Nogal"],"Сосна":["Pine","Kiefer","Pin","Pino"],"Берёза":["Birch","Birke","Bouleau","Abedul"],"Ламинат":["Laminate","Laminat","Stratifié","Laminado"],"Ламинат: дуб":["Laminate: oak","Laminat: Eiche","Stratifié : chêne","Laminado: roble"],"Ламинат: орех":["Laminate: walnut","Laminat: Nuss","Stratifié : noyer","Laminado: nogal"],"Ламинат: серый":["Laminate: grey","Laminat: Grau","Stratifié : gris","Laminado: gris"],"Ламинат: белёный":["Laminate: whitewashed","Laminat: gekalkt","Stratifié : blanchi","Laminado: blanqueado"],"МДФ":["MDF","MDF","MDF","MDF"],"Плиты":["Boards","Platten","Panneaux","Tableros"],"Металл":["Metal","Metall","Métal","Metal"],"Шлифованный металл":["Brushed metal","Gebürstetes Metall","Métal brossé","Metal cepillado"],"Медь":["Copper","Kupfer","Cuivre","Cobre"],"Латунь":["Brass","Messing","Laiton","Latón"],"Рифлёный лист":["Diamond plate","Riffelblech","Tôle gaufrée","Chapa estriada"],"Перфорация":["Perforated","Lochblech","Perforé","Perforado"],"Мрамор":["Marble","Marmor","Marbre","Mármol"],"Гранит":["Granite","Granit","Granit","Granito"],"Бетон":["Concrete","Beton","Béton","Hormigón"],"Кирпич":["Brick","Ziegel","Brique","Ladrillo"],"Камень и плитка":["Stone and tile","Stein und Fliesen","Pierre et carrelage","Piedra y baldosas"],"Стекло":["Glass","Glas","Verre","Vidrio"],"Резина":["Rubber","Gummi","Caoutchouc","Goma"],"Пластик и стекло":["Plastic and glass","Kunststoff und Glas","Plastique et verre","Plástico y vidrio"],"Штукатурка":["Plaster","Putz","Enduit","Revoque"],"Краска":["Paint","Farbe","Peinture","Pintura"],"Ткань":["Fabric","Stoff","Tissu","Tela"],"Пробка":["Cork","Kork","Liège","Corcho"],"Обои":["Wallpaper","Tapete","Papier peint","Papel pintado"],"Отделка стен":["Wall finishes","Wandverkleidung","Finitions murales","Acabados de pared"],"Добавить горизонтальный каркас":["Add horizontal frame","Horizontalen Rahmen hinzufügen","Ajouter une ossature horizontale","Añadir estructura horizontal"],"Каркас: из чего сделан":["Frame: what it is made of","Rahmen: aus welchem Material","Ossature : matériau","Estructura: de qué material"],"Листовой материал":["Sheet materials","Plattenmaterial","Matériaux en plaque","Materiales en lámina"],"Фанера, гипсокартон, ОСБ, ДСП, плитка, ламинат и другие листы. Для каждого задаются текстура, цвет, размеры листа и толщина.":["Plywood, drywall, OSB, chipboard, tiles, laminate and other sheets. Each has a texture, colour, sheet sizes and thickness.","Sperrholz, Gipskarton, OSB, Spanplatte, Fliesen, Laminat und weitere Platten. Je Material: Textur, Farbe, Plattengrößen und Stärke.","Contreplaqué, plaque de plâtre, OSB, aggloméré, carrelage, stratifié et autres plaques. Pour chacun : texture, couleur, formats et épaisseur.","Contrachapado, yeso laminado, OSB, aglomerado, baldosas, laminado y otras láminas. Cada uno tiene textura, color, tamaños y grosor."],"Профили, трубы, уголки, арматура, балки. Для каждого задаются текстура, цвет, длина заготовки и сечение.":["Profiles, pipes, angles, rebar, beams. Each has a texture, colour, stock length and cross-section.","Profile, Rohre, Winkel, Bewehrung, Träger. Je Material: Textur, Farbe, Länge und Querschnitt.","Profilés, tubes, cornières, armatures, poutres. Pour chacun : texture, couleur, longueur et section.","Perfiles, tubos, ángulos, armaduras, vigas. Cada uno tiene textura, color, longitud y sección."],"Брус, доски, рейки, вагонка. Для каждого задаются текстура, цвет, длина заготовки и сечение.":["Beams, boards, battens, tongue-and-groove panelling. Each has a texture, colour, stock length and cross-section.","Balken, Bretter, Latten, Profilholz. Je Material: Textur, Farbe, Länge und Querschnitt.","Poutres, planches, lattes, lambris. Pour chacun : texture, couleur, longueur et section.","Vigas, tablas, listones, machihembrado. Cada uno tiene textura, color, longitud y sección."],"Категории материалов":["Material categories","Materialkategorien","Catégories de matériaux","Categorías de materiales"],"Категория":["Category","Kategorie","Catégorie","Categoría"],"Добавить размер":["Add size","Größe hinzufügen","Ajouter une taille","Añadir tamaño"],"Размеров пока нет: добавьте первый ниже.":["No sizes yet: add the first one below.","Noch keine Größen: Fügen Sie unten die erste hinzu.","Aucune taille pour l’instant : ajoutez la première ci-dessous.","Aún no hay tamaños: añada el primero abajo."],"В этой категории пока пусто":["This category is empty","Diese Kategorie ist noch leer","Cette catégorie est vide","Esta categoría está vacía"],"Добавьте свой материал или верните стандартные.":["Add your own material or restore the defaults.","Fügen Sie ein eigenes Material hinzu oder stellen Sie die Standardmaterialien wieder her.","Ajoutez votre matériau ou restaurez ceux par défaut.","Añada su material o restaure los predeterminados."],"Балка, двутавр":["Beam, I-beam","Träger, Doppel-T","Poutre, IPN","Viga, doble T"],"Швеллер":["Channel","U-Profil","Profilé en U","Perfil en U"],"Брус":["Timber beam","Balken","Poutre","Viga de madera"],"Рейка":["Batten","Latte","Latte","Listón"],"Вагонка":["Tongue-and-groove panel","Profilholz","Lambris","Machihembrado"],"Введите длину":["Enter the length","Länge eingeben","Saisissez la longueur","Introduzca la longitud"],"Введите ширину и высоту":["Enter width and height","Breite und Höhe eingeben","Saisissez largeur et hauteur","Introduzca ancho y alto"],"Такой размер уже есть":["This size already exists","Diese Größe gibt es schon","Cette taille existe déjà","Este tamaño ya existe"],"Размер добавлен":["Size added","Größe hinzugefügt","Taille ajoutée","Tamaño añadido"],"Материал перенесён:":["Material moved:","Material verschoben:","Matériau déplacé :","Material movido:"],"Например, Доска строганая":["For example, Planed board","Zum Beispiel: Gehobeltes Brett","Par exemple : planche rabotée","Por ejemplo: tabla cepillada"],"Например, Профиль ПН":["For example, U-track profile","Zum Beispiel: U-Anschlussprofil","Par exemple : profilé de rail","Por ejemplo: perfil de canal"],"Доска":["Board","Brett","Planche","Tabla"],"Избранное":["Favourites","Favoriten","Favoris","Favoritos"],"В избранное":["Add to favourites","Zu Favoriten","Ajouter aux favoris","Añadir a favoritos"],"Убрать из избранного":["Remove from favourites","Aus Favoriten entfernen","Retirer des favoris","Quitar de favoritos"],"Добавлено в избранное":["Added to favourites","Zu Favoriten hinzugefügt","Ajouté aux favoris","Añadido a favoritos"],"Убрано из избранного":["Removed from favourites","Aus Favoriten entfernt","Retiré des favoris","Quitado de favoritos"],"В избранном пока пусто: отметьте материал звёздочкой в любом списке.":["Favourites are empty: mark a material with the star in any list.","Noch keine Favoriten: Markieren Sie ein Material in einer beliebigen Liste mit dem Stern.","Aucun favori pour l’instant : marquez un matériau avec l’étoile dans n’importe quelle liste.","Aún no hay favoritos: marque un material con la estrella en cualquier lista."],"В этой категории пока пусто.":["This category is empty.","Diese Kategorie ist noch leer.","Cette catégorie est vide.","Esta categoría está vacía."],"Не выбран":["Not selected","Nicht gewählt","Non sélectionné","Sin seleccionar"],"Выберите из списка":["Choose from the list","Aus der Liste wählen","Choisir dans la liste","Elegir de la lista"],"Материалы, отмеченные звёздочкой. Они показываются отдельной вкладкой при выборе материала для стен, пола, потолка и каркаса.":["Materials marked with a star. They appear as a separate tab when you choose a material for walls, floor, ceiling and frame.","Mit Stern markierte Materialien. Sie erscheinen beim Auswählen von Material für Wände, Boden, Decke und Rahmen als eigener Reiter.","Matériaux marqués d’une étoile. Ils apparaissent dans un onglet séparé lors du choix du matériau des murs, du sol, du plafond et de l’ossature.","Materiales marcados con una estrella. Aparecen en una pestaña aparte al elegir material para paredes, suelo, techo y estructura."],"В избранном пока пусто":["Favourites are empty","Noch keine Favoriten","Aucun favori pour l’instant","Aún no hay favoritos"],"Откройте любую категорию и нажмите звёздочку рядом с материалом.":["Open any category and tap the star next to a material.","Öffnen Sie eine Kategorie und tippen Sie auf den Stern neben einem Material.","Ouvrez une catégorie et appuyez sur l’étoile à côté d’un matériau.","Abra una categoría y pulse la estrella junto a un material."],"Размер листа":["Sheet size","Plattengröße","Format de la plaque","Tamaño de la lámina"],"Применить ко всем поверхностям":["Apply to all surfaces","Auf alle Flächen anwenden","Appliquer à toutes les surfaces","Aplicar a todas las superficies"],"Материал применён ко всем поверхностям":["Material applied to all surfaces","Material auf alle Flächen angewendet","Matériau appliqué à toutes les surfaces","Material aplicado a todas las superficies"],"Листовых материалов нет: добавьте их на вкладке «Материалы».":["No sheet materials: add them on the Materials tab.","Keine Plattenmaterialien: Fügen Sie sie im Reiter „Materialien“ hinzu.","Aucun matériau en plaque : ajoutez-en dans l’onglet Matériaux.","No hay materiales en lámina: añádalos en la pestaña Materiales."],"Для этого материала нет размеров в библиотеке: добавьте их на вкладке «Материалы».":["This material has no sizes in the library: add them on the Materials tab.","Für dieses Material gibt es keine Größen: Fügen Sie sie im Reiter „Materialien“ hinzu.","Ce matériau n’a pas de tailles : ajoutez-en dans l’onglet Matériaux.","Este material no tiene tamaños: añádalos en la pestaña Materiales."],"материал":["material","Material","matériau","material"],"Включить ручную раскладку материала":["Enable manual material layout","Manuelle Materialverlegung aktivieren","Activer la pose manuelle du matériau","Activar la disposición manual del material"],"Количество, шт.":["Quantity, pcs","Anzahl, Stk.","Quantité, pcs","Cantidad, uds."],"авто":["auto","auto","auto","auto"],"Горизонтальные профили на чертеже двигаются все вместе; включите «по отдельности», чтобы тянуть каждый отдельно. «По центру» ставит их на равных расстояниях по высоте.":["Horizontal profiles move all together on the drawing; turn on “one by one” to drag each separately. “Centre” places them at equal distances over the height.","Horizontale Profile bewegen sich in der Zeichnung alle zusammen; schalten Sie „einzeln“ ein, um jedes separat zu ziehen. „Zentrieren“ setzt sie in gleichen Abständen über die Höhe.","Les profilés horizontaux se déplacent tous ensemble sur le dessin ; activez « un par un » pour déplacer chacun séparément. « Au centre » les place à distances égales sur la hauteur.","Los perfiles horizontales se mueven todos juntos en el dibujo; active «uno por uno» para arrastrar cada uno por separado. «Centrar» los coloca a distancias iguales a lo alto."],"Поворот раскладки":["Layout rotation","Drehung der Verlegung","Rotation du calepinage","Giro de la colocación"],"Повернуть по часовой стрелке":["Rotate clockwise","Im Uhrzeigersinn drehen","Tourner dans le sens horaire","Girar en sentido horario"],"Повернуть против часовой стрелки":["Rotate counterclockwise","Gegen den Uhrzeigersinn drehen","Tourner dans le sens antihoraire","Girar en sentido antihorario"],"Шаг поворота":["Rotation step","Drehschritt","Pas de rotation","Paso de giro"],"Ручная раскладка":["Manual layout","Manuelle Verlegung","Calepinage manuel","Colocación manual"],"Показать раскладку":["Show layout","Verlegung anzeigen","Afficher le calepinage","Mostrar colocación"],"Стойки идут по высоте стены. Горизонтальные профили добавляются в рабочем окне.":["Studs run along the wall height. Horizontal profiles are added in the work window.","Ständer verlaufen über die Wandhöhe. Horizontale Profile werden im Arbeitsfenster hinzugefügt.","Les montants suivent la hauteur du mur. Les profilés horizontaux s’ajoutent dans la fenêtre de travail.","Los montantes van a lo alto de la pared. Los perfiles horizontales se añaden en la ventana de trabajo."],"Профили идут поперёк. Горизонтальные профили добавляются в рабочем окне.":["Profiles run across. Horizontal profiles are added in the work window.","Profile verlaufen quer. Horizontale Profile werden im Arbeitsfenster hinzugefügt.","Les profilés sont posés en travers. Les profilés horizontaux s’ajoutent dans la fenêtre de travail.","Los perfiles van en transversal. Los perfiles horizontales se añaden en la ventana de trabajo."],"Применить каркас ко всем стенам":["Apply frame to all walls","Rahmen auf alle Wände anwenden","Appliquer l’ossature à tous les murs","Aplicar la estructura a todas las paredes"],"Каркас включён на всех стенах":["Frame enabled on all walls","Rahmen an allen Wänden aktiviert","Ossature activée sur tous les murs","Estructura activada en todas las paredes"],"Показывать подрезку красным пунктиром":["Show trimming as red dashes","Zuschnitt rot gestrichelt anzeigen","Afficher les recoupes en pointillés rouges","Mostrar los recortes con trazo rojo discontinuo"],"Заполнить всю поверхность":["Fill the whole surface","Ganze Fläche füllen","Remplir toute la surface","Rellenar toda la superficie"],"Количество вручную":["Enter quantity manually","Anzahl manuell","Quantité manuelle","Cantidad manual"],"Сколько дерева":["How much wood","Wie viel Holz","Quantité de bois","Cuánta madera"],"Как класть доски":["How to lay the boards","Verlegerichtung der Bretter","Sens de pose des planches","Cómo colocar las tablas"],"Длина доски":["Board length","Brettlänge","Longueur de la planche","Largo de la tabla"],"Введите количество досок.":["Enter the number of boards.","Geben Sie die Anzahl der Bretter ein.","Saisissez le nombre de planches.","Introduzca el número de tablas."],"Укажите ширину доски.":["Enter the board width.","Geben Sie die Brettbreite ein.","Saisissez la largeur de la planche.","Introduzca el ancho de la tabla."],"введите количество":["enter quantity","Anzahl eingeben","saisir la quantité","introduzca la cantidad"],"укажите ширину доски":["enter board width","Brettbreite eingeben","saisir la largeur de la planche","introduzca el ancho de la tabla"],"Досок на поверхностях":["Boards on surfaces","Bretter auf den Flächen","Planches sur les surfaces","Tablas en las superficies"],"Кусков после раскроя":["Pieces after cutting","Stücke nach dem Zuschnitt","Morceaux après découpe","Piezas tras el corte"],"Погонных метров":["Running metres","Laufmeter","Mètres linéaires","Metros lineales"],"Закрывают":["Cover","Decken ab","Couvrent","Cubren"],"Досок":["Boards","Bretter","Planches","Tablas"],"На этой поверхности дерево: доски раскладываются автоматически. Режим, направление и ширину доски задайте в карточке поверхности, раздел «Материал».":["This surface is covered with wood: boards are laid out automatically. Set the mode, direction and board width in the surface card, “Material” section.","Diese Fläche ist mit Holz belegt: Die Bretter werden automatisch verlegt. Modus, Richtung und Brettbreite stellen Sie in der Flächenkarte im Abschnitt „Material“ ein.","Cette surface est en bois : les planches sont disposées automatiquement. Réglez le mode, le sens et la largeur dans la fiche de la surface, section « Matériau ».","Esta superficie es de madera: las tablas se colocan automáticamente. Ajuste el modo, la dirección y el ancho en la ficha de la superficie, sección «Material»."],"Как считать материал":["How to calculate the material","Wie das Material berechnet wird","Comment calculer le matériau","Cómo calcular el material"],"По раскладке, остатки используются":["By layout, offcuts are reused","Nach Verlegung, Reste werden genutzt","Selon le calepinage, chutes réutilisées","Según colocación, se reutilizan los restos"],"По раскладке, каждый обрезок отдельным листом":["By layout, each trimmed piece on its own sheet","Nach Verlegung, jeder Zuschnitt auf eigener Platte","Selon le calepinage, chaque coupe sur sa propre plaque","Según colocación, cada recorte en su propia plancha"],"Каждый обрезок отдельным листом":["Each trimmed piece on its own sheet","Jeder Zuschnitt auf eigener Platte","Chaque coupe sur sa propre plaque","Cada recorte en su propia plancha"],"Площадь поверхностей без проёмов плюс запас делится на площадь листа. Быстрый прикидочный расчёт: швы и подрезка по схеме не учитываются.":["The surface area without openings plus the reserve is divided by the sheet area. A quick estimate: joints and trimming on the layout are not taken into account.","Die Fläche ohne Öffnungen plus Reserve wird durch die Plattenfläche geteilt. Schnelle Schätzung: Fugen und Zuschnitt laut Verlegeplan werden nicht berücksichtigt.","La surface sans ouvertures plus la réserve est divisée par la surface d’une plaque. Estimation rapide : les joints et les coupes du calepinage ne sont pas pris en compte.","La superficie sin huecos más la reserva se divide entre el área de la plancha. Estimación rápida: no se tienen en cuenta las juntas ni los recortes del esquema."],"Целые листы берутся по схеме, а подрезанные куски и вырезы из проёмов раскраиваются из общих листов и остатков. Листов нужно меньше всего.":["Whole sheets are taken from the layout, while trimmed pieces and cut-outs from openings are cut from shared sheets and offcuts. This needs the fewest sheets.","Ganze Platten werden laut Verlegeplan angesetzt, Zuschnitte und Ausschnitte aus Öffnungen werden aus gemeinsamen Platten und Resten geschnitten. So werden die wenigsten Platten benötigt.","Les plaques entières sont prises selon le calepinage ; les morceaux recoupés et les découpes d’ouvertures sont taillés dans des plaques communes et des chutes. C’est le moins de plaques.","Las planchas enteras se toman del esquema; los recortes y los huecos de las aberturas se cortan de planchas comunes y de restos. Es la opción que menos planchas necesita."],"Каждый подрезанный кусок на схеме берёт целый лист, остатки и вырезы не используются. Подходит, если режете отдельно по каждой стене.":["Each trimmed piece on the layout takes a whole sheet; offcuts and cut-outs are not reused. Suitable if you cut each wall separately.","Jedes zugeschnittene Stück laut Verlegeplan nimmt eine ganze Platte; Reste und Ausschnitte werden nicht genutzt. Geeignet, wenn Sie jede Wand einzeln zuschneiden.","Chaque morceau recoupé du calepinage prend une plaque entière ; les chutes et découpes ne sont pas réutilisées. Convient si vous découpez chaque mur séparément.","Cada recorte del esquema ocupa una plancha entera; no se reutilizan restos ni huecos. Sirve si corta cada pared por separado."],", чтобы сдвинуть сетку раскладки.":[", to shift the layout grid.",", um das Verlegeraster zu verschieben.",", pour décaler la grille de calepinage.",", para desplazar la cuadrícula de colocación."],"Чтобы сдвигать плитку или листы самому, включите «Раскладка вручную».":["To move tiles or sheets yourself, turn on “Manual layout”.","Um Fliesen oder Platten selbst zu verschieben, aktivieren Sie „Manuelle Verlegung“.","Pour déplacer vous-même les carreaux ou plaques, activez « Calepinage manuel ».","Para mover usted mismo las baldosas o planchas, active «Colocación manual»."],"Чтобы двигать двери, окна и проёмы, откройте вкладку «Проёмы».":["To move doors, windows and openings, open the “Openings” tab.","Um Türen, Fenster und Öffnungen zu verschieben, öffnen Sie den Reiter „Öffnungen“.","Pour déplacer les portes, fenêtres et ouvertures, ouvrez l’onglet « Ouvertures ».","Para mover puertas, ventanas y huecos, abra la pestaña «Huecos»."],"Раскладка вручную: материал":["Manual layout: material","Manuelle Verlegung: Material","Calepinage manuel : matériau","Colocación manual: material"],"Раскладка вручную: каркас":["Manual layout: frame","Manuelle Verlegung: Rahmen","Calepinage manuel : ossature","Colocación manual: estructura"],"Раскладка вручную: двери, окна и проёмы":["Manual layout: doors, windows and openings","Manuelle Verlegung: Türen, Fenster und Öffnungen","Calepinage manuel : portes, fenêtres et ouvertures","Colocación manual: puertas, ventanas y huecos"],"Переименовать комнату":["Rename room","Raum umbenennen","Renommer la pièce","Renombrar estancia"],"Изменить название":["Change name","Namen ändern","Modifier le nom","Cambiar nombre"],"Название поверхности":["Surface name","Name der Fläche","Nom de la surface","Nombre de la superficie"],"Продолжить":["Continue","Weiter","Continuer","Continuar"],"Вернуться к расчёту на вкладке «Площадь»":["Back to your calculation on the Area tab","Zurück zur Berechnung im Tab „Fläche“","Retour au calcul dans l'onglet « Surface »","Volver al cálculo en la pestaña «Superficie»"],"Сначала создайте комнату":["Create a room first","Erstellen Sie zuerst einen Raum","Créez d'abord une pièce","Primero cree una estancia"],"Нажмите на стену или пол, чтобы открыть её в развёртке.":["Tap a wall or the floor to open it in the flat view.","Tippen Sie auf eine Wand oder den Boden, um sie in der Abwicklung zu öffnen.","Touchez un mur ou le sol pour l’ouvrir dans le développé.","Pulse una pared o el suelo para abrirlos en el desarrollo."],"Расставить вручную":["Arrange by hand","Manuell anordnen","Disposer à la main","Colocar a mano"],"Перетаскивайте детали по листу. Нажмите на деталь, чтобы повернуть её или указать отступы от краёв листа до распила.":["Drag the pieces around the sheet. Tap a piece to rotate it or to set the distances from the sheet edges to the cut.","Ziehen Sie die Teile über die Platte. Tippen Sie auf ein Teil, um es zu drehen oder die Abstände von den Plattenkanten bis zum Schnitt einzugeben.","Faites glisser les pièces sur la plaque. Touchez une pièce pour la pivoter ou saisir les distances entre les bords de la plaque et la coupe.","Arrastre las piezas por la plancha. Pulse una pieza para girarla o indicar las distancias desde los bordes de la plancha hasta el corte."],"Авто-раскладка":["Auto layout","Automatische Anordnung","Disposition auto","Distribución automática"],"Убрать лист":["Remove sheet","Platte entfernen","Retirer la plaque","Quitar plancha"],"Нажмите на деталь, и она встанет на первое свободное место.":["Tap a piece and it goes to the first free spot.","Tippen Sie auf ein Teil, es wird auf den ersten freien Platz gelegt.","Touchez une pièce, elle ira à la première place libre.","Pulse una pieza y se colocará en el primer hueco libre."],"Повернуть":["Rotate","Drehen","Pivoter","Girar"],"Убрать с листа":["Take off the sheet","Von der Platte nehmen","Retirer de la plaque","Quitar de la plancha"],"Разместите все детали без пересечений":["Place all pieces without overlaps","Platzieren Sie alle Teile ohne Überlappung","Placez toutes les pièces sans chevauchement","Coloque todas las piezas sin solapes"],"Итог посчитан по размещённым деталям.":["The total counts the placed pieces only.","Die Summe zählt nur die platzierten Teile.","Le total ne compte que les pièces placées.","El total cuenta solo las piezas colocadas."],"Настройки":["Settings","Einstellungen","Réglages","Ajustes"],"Закрыть":["Close","Schließen","Fermer","Cerrar"],"Тема":["Theme","Design","Thème","Tema"],"Тёмная":["Dark","Dunkel","Sombre","Oscuro"],"Светлая":["Light","Hell","Clair","Claro"],"Прозрачность":["Transparency","Transparenz","Transparence","Transparencia"],"Контур обрезки":["Cut outline","Schnittkontur","Contour de coupe","Contorno de corte"],"Толщина":["Thickness","Stärke","Épaisseur","Grosor"],"Двери, окна и проёмы":["Doors, windows and openings","Türen, Fenster und Öffnungen","Portes, fenê
