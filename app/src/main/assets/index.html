<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Раскрой</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout concept: одна колонка, три вкладки (Расчёт / Библиотека / Корзина); материал, размер, детали идут по шагам, результат под ними. */
:root {
  /* Color: тёмный графит как в 3D-редакторах, акцент оранжевый (цвет выделения), нейтральные холодные серые */
  --bg: #ECEEF1;
  --surface: #FFFFFF;
  --surface-2: #E1E5EA;
  --ink: #16181D;
  --muted: #566070;
  --line: #D3D8DF;
  --accent: #C2540A;
  --accent-ink: #FFFFFF;
  --accent-soft: #FCE8D8;
  --danger: #B42318;
  --hatch-a: #E6E9ED;
  --hatch-b: #D9DDE3;
  --pill-bg: rgba(18, 20, 19, .66);
  --pill-fg: #FFFFFF;
  --cut: rgba(20, 22, 21, .45);
  /* Type: Unbounded только для названия и крупного числа, Golos Text для интерфейса, JetBrains Mono для размеров */
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181B; --surface: #212328; --surface-2: #2B2E34; --ink: #ECEEF1; --muted: #9AA1AD;
    --line: #353941; --accent: #F29A3A; --accent-ink: #1A1002; --accent-soft: #3A2A18; --danger: #F2766B;
    --hatch-a: #25272C; --hatch-b: #1C1E22; --cut: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17181B; --surface: #212328; --surface-2: #2B2E34; --ink: #ECEEF1; --muted: #9AA1AD;
  --line: #353941; --accent: #F29A3A; --accent-ink: #1A1002; --accent-soft: #3A2A18; --danger: #F2766B;
  --hatch-a: #25272C; --hatch-b: #1C1E22; --cut: rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.45 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.btn:active:not(:disabled), button.sitem:active, .seg2 button:active:not(:disabled), .chip:active, .drow:active, .mrow:active, .type:active, .gtab:active, .star:active, .x:active { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); transform: scale(.97); }
@keyframes tapfx { 0% { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); } 100% { box-shadow: inset 0 0 0 2px transparent; } }
.tapfx { animation: tapfx .55s ease-out; }
.wrap { max-width: 860px; margin: 0 auto; }
.wrap.wide { max-width: 1180px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* шапка */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding: 14px 0 10px; }
.bar1 { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font: 600 17px/1 var(--f-display); letter-spacing: -.01em; }
.brand svg { width: 26px; height: 26px; color: var(--accent); }
.tools { display: flex; align-items: center; gap: 8px; }
.sel, .iconbtn {
  height: 36px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
}
.sel { padding: 0 8px; font-family: var(--f-mono); font-size: 13px; }
.iconbtn { width: 36px; display: grid; place-items: center; }
.iconbtn svg { width: 18px; height: 18px; }
.tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 12px; padding: 4px; background: var(--surface-2); border-radius: 12px; }
.tab { position: relative; border: 0; background: transparent; height: 38px; border-radius: 9px; font-weight: 500; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 7px; }
.tab svg { width: 17px; height: 17px; flex: none; }
.tab .tl { line-height: 1.1; text-align: center; overflow-wrap: break-word; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font: 500 12px/20px var(--f-mono); text-align: center; }

/* секции */
.view { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.sec > h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.sec > h2 .st { font: 500 12px/1 var(--f-mono); color: var(--accent); }
.hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }

/* материалы */
.types { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.type {
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px 10px;
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); font-size: 13px; text-align: center; line-height: 1.2; min-width: 0;
}
.msel { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); text-align: left; min-height: 60px; }
.msel[aria-expanded="true"] { border-color: var(--accent); }
.msel .t, .mrow .t { flex: 1; min-width: 0; }
.msel .t b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.msel .t small { color: var(--muted); font-size: 12px; }
.msel .ti { width: 44px; height: 44px; }
.cv { flex: none; width: 28px; height: 28px; display: grid; place-items: center; color: var(--muted); }
.cv svg { width: 20px; height: 20px; transition: transform .15s; }
[aria-expanded="true"] > .cv svg { transform: rotate(180deg); }
.mlist { display: flex; flex-direction: column; margin-top: 8px; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden auto; max-height: min(60vh, 480px); background: var(--surface); }
.mrow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 6px 12px; border: 0; border-top: 1px solid var(--line); background: var(--surface); text-align: left; min-height: 48px; }
.mrow:first-child { border-top: 0; }
.mrow:hover { background: var(--surface-2); }
.mrow[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.mrow .ti { width: 36px; height: 36px; }
.mrow .k { color: var(--muted); font-size: 12px; white-space: nowrap; }
.mrow.add { color: var(--muted); }
.mrow.add svg { width: 24px; height: 24px; margin: 6px; }
.type.add > svg { width: 26px; height: 26px; margin: 11px 0; }
.ti { width: 50px; height: 50px; flex: none; display: block; }
.ti svg { width: 100%; height: 100%; display: block; overflow: visible; }
.thead .ti, .ci-head .ti { width: 46px; height: 46px; }
.icons .ti { width: 38px; height: 38px; }
.texbox { display: flex; flex-direction: column; }
.dot { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .25); padding: 0; }
.dot[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
.dotpick { position: relative; width: 26px; height: 26px; border-radius: 50%; overflow: hidden; border: 1px solid var(--line); background: conic-gradient(#e5484d, #f5a623, #f1e05a, #46a758, #3e8bff, #8e4ec6, #e5484d); }
.dotpick input { position: absolute; inset: -6px; width: 40px; height: 40px; opacity: 0; cursor: pointer; padding: 0; border: 0; }
.dotpick:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.type[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.type.add { border-style: dashed; color: var(--muted); }
.tex-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
.tex-row .lab { font-size: 13px; color: var(--muted); margin-right: 2px; }
.sw { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); padding: 0; }
.sw[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }

/* форма своего материала */
.newtype { margin-top: 12px; padding: 14px; border: 1px dashed var(--line); border-radius: var(--r); display: flex; flex-direction: column; gap: 12px; }
.icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.icons button { height: 50px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; display: grid; place-items: center; }
.icons button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

/* поля */
.grid { display: grid; gap: 10px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; color: var(--muted); }
.in {
  width: 100%; height: 40px; padding: 0 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
  font-family: var(--f-mono); font-size: 14px;
}
.in.txt { font-family: var(--f-body); }
.in::placeholder { color: var(--muted); opacity: .7; }
.in:invalid, .in.bad { border-color: var(--danger); }
.seg2 { display: inline-grid; grid-auto-flow: column; gap: 4px; padding: 3px; background: var(--surface-2); border-radius: 9px; }
.seg2 button { border: 0; background: transparent; height: 32px; padding: 0 14px; border-radius: 7px; color: var(--muted); font-size: 14px; }
.seg2 button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }

.btn { height: 40px; padding: 0 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn svg { width: 17px; height: 17px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.warn { color: var(--danger); border-color: var(--danger); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font: 400 13px var(--f-mono); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.chip small { font-family: var(--f-body); color: var(--muted); margin-left: 6px; }

/* строки деталей */
.rows { display: flex; flex-direction: column; gap: 8px; }
.rowh, .row { display: grid; gap: 8px; align-items: center; }
.rows.sheet .rowh, .rows.sheet .row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 76px 36px; }
.rows.linear .rowh, .rows.linear .row { grid-template-columns: minmax(0, 1fr) 90px 36px; }
.rowh span { font-size: 12px; color: var(--muted); }
.x { width: 36px; height: 36px; border: 0; background: transparent; color: var(--muted); border-radius: 8px; display: grid; place-items: center; }
.x:hover { color: var(--danger); background: var(--surface-2); }
.x.armed { background: var(--danger); color: #fff; }
.x svg { width: 17px; height: 17px; }
.opts { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.opts .field { width: 110px; }
.check { display: flex; align-items: center; gap: 8px; height: 40px; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

/* результат */
.big { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px 14px; }
.big b { font: 600 52px/1 var(--f-display); letter-spacing: -.03em; color: var(--accent); }
.big span { font-size: 17px; font-weight: 500; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 14px 0 0; }
.stats div { min-width: 0; }
.stats dt { font-size: 12px; color: var(--muted); }
.stats dd { margin: 0; font: 500 15px var(--f-mono); font-variant-numeric: tabular-nums; }
.warn-box { margin-top: 12px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--danger); color: var(--danger); font-size: 14px; }
.viz { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; }
.vcap { display: flex; justify-content: space-between; gap: 10px; font: 400 12px var(--f-mono); color: var(--muted); margin-bottom: 5px; }
.hatch { background: repeating-linear-gradient(135deg, var(--hatch-a) 0 6px, var(--hatch-b) 6px 12px); }
.lin { position: relative; height: 38px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.box { position: relative; width: 100%; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.p { position: absolute; display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: inset 0 0 0 1px var(--cut); }
.lin .p { top: 0; bottom: 0; }
.lbl { background: var(--pill-bg); color: var(--pill-fg); font: 500 var(--dim-fs, 11px)/1.3 var(--f-mono); padding: 1px 5px; border-radius: 4px; white-space: nowrap; }
.mini .lin { height: 22px; }
.mini .lbl { display: none; }

/* библиотека */
.stock { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.stock .sz { font: 500 14px var(--f-mono); }
.stock .sp { color: var(--muted); font-size: 13px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.thead { display: flex; align-items: center; gap: 12px; }
.thead h3 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; min-width: 0; }
.thead small { color: var(--muted); font-weight: 400; margin-left: 6px; }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.empty svg { width: 40px; height: 40px; margin-bottom: 8px; }
.empty b { display: block; color: var(--ink); font-weight: 600; margin-bottom: 4px; }

/* корзина */
.ci-head { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.sec.compact { padding: 12px 16px; }
.chev svg { transition: transform .15s; }
.chev[aria-expanded="false"] svg { transform: rotate(-90deg); }
.cbar { display: flex; flex-wrap: wrap; gap: 8px; }
.btn.sm { height: 34px; padding: 0 12px; font-size: 13px; }
.btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.ci-head .t { flex: 1; min-width: 0; }
.ci-head h3 { margin: 0; font-size: 16px; font-weight: 600; }
.ci-head .s { font: 400 13px var(--f-mono); color: var(--muted); overflow-wrap: anywhere; }
.ci-n { font: 600 22px var(--f-display); color: var(--accent); white-space: nowrap; }
.tbl { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
.tbl th { text-align: left; font-weight: 400; font-size: 12px; color: var(--muted); padding: 4px 0; }
.tbl td { padding: 5px 0; border-top: 1px solid var(--line); font-family: var(--f-mono); }
.tbl td:last-child, .tbl th:last-child { text-align: right; }
.cirest { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
.cirest b { color: var(--ink); font-weight: 500; font-family: var(--f-mono); }
.ci-act { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.sum { display: flex; flex-direction: column; gap: 6px; }
.sum div { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.sum b { font: 500 14px var(--f-mono); white-space: nowrap; }
.data { width: 100%; min-height: 84px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font: 400 12px/1.4 var(--f-mono); resize: vertical; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 18px; text-align: center; font-size: 14px; z-index: 40; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .18s; }
.toast.on { opacity: 1; }

/* текстуры задаются из скрипта */
.strip { height: 8px; border-radius: 4px; margin-bottom: 14px; border: 1px solid var(--line); }


/* библиотека списком */
.llist { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
.lrow { border-top: 1px solid var(--line); }
.lrow:first-child { border-top: 0; }
.lhead { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 14px; border: 0; background: transparent; text-align: left; min-height: 56px; }
.lhead:hover { background: var(--surface-2); }
.lhead .t { flex: 1; min-width: 0; }
.lhead .t b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.lhead .t small { color: var(--muted); font-size: 12px; }
.lhead .ti { width: 40px; height: 40px; }
.lbody { padding: 2px 14px 14px; }
.sizes { margin-top: 10px; }

/* по площади */
.sub { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.ocards { display: flex; flex-direction: column; gap: 8px; }
/* стены: номера слева, данные выбранной стены справа */
.smd { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 6px; align-items: start; }
.srail { display: flex; flex-direction: column; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hdr, 124px) + 8px); max-height: calc(100vh - 150px); overflow-y: auto; scrollbar-width: none; }
.srail::-webkit-scrollbar { display: none; }
.sitem { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; width: 100%; min-height: 34px; padding: 2px 0; border-radius: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
.sitem .sn { font: 700 13px/1.1 var(--f-mono); display: grid; place-items: center; height: 16px; }
.sitem .sn svg { width: 14px; height: 14px; color: var(--accent); }
.tgl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tgl .btn, .btn.tog { height: auto; min-height: 40px; white-space: normal; line-height: 1.2; padding: 6px 10px; text-align: center; }
.btn[aria-pressed="true"]:not(:disabled) { background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); }
.sitem.inc { position: relative; }
.sitem.inc::after { content: ''; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--ok, #2fa36b); box-shadow: 0 0 0 1.5px var(--bg); }
.sitem small { font-size: 7.5px; line-height: 1.1; max-width: 100%; overflow: hidden; text-overflow: clip; color: var(--muted); }
.sitem.on { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 1px var(--accent); }
.sitem.on small, .sitem.on .sn svg { color: var(--accent-ink); }
.sitem.add { border-style: dashed; background: transparent; min-height: 30px; }
.sitem.add .sn { color: var(--accent); height: 14px; font-size: 12px; }
.sdet { min-width: 0; }
.devwrap { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 6px; align-items: start; }
.devmain { min-width: 0; }
.devrail { top: calc(env(safe-area-inset-top, 0px) + var(--hdr, 124px) + 8px); }
.sechead { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 2px; margin: 4px 0 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; color: var(--muted); }
.sechead .sht { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; flex: none; }
.sechead small { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); font-size: 12px; }
.sechead svg { margin-left: auto; flex: none; width: 18px; height: 18px; transition: transform .2s; }
.sechead[aria-expanded="false"] svg { transform: rotate(-90deg); }
.secbody { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.secbody[hidden] { display: none; }

.rlist { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }

@media (min-width: 980px) {
  .view.area { display: grid; grid-template-columns: 172px minmax(0, 470px) minmax(0, 1fr); gap: 14px; align-items: start; }
  /* левая колонка комнат компактная: больше места под настройки */
  .view.area > #aRooms { padding: 10px; }
  .view.area > #aRooms h2 { font-size: 11px; margin-bottom: 8px; }
  .view.area > #aRooms .rrow { flex-wrap: wrap; gap: 0; }
  .view.area > #aRooms .rrow .rsel { padding: 6px 4px 6px 8px; gap: 6px; flex: 1; min-width: 0; width: auto; }
  .view.area > #aRooms .rrow .rsel .si { display: none; }
  .view.area > #aRooms .rrow .rsel .t small { display: none; }
  .view.area > #aRooms .rrow .rsel .t b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .view.area > #aRooms .rrow .x { width: 24px; height: 28px; }
  .view.area > #aRooms .rrow .x svg { width: 16px; height: 16px; }
  .view.area > #aRooms .actions { gap: 6px; flex-direction: column; flex-wrap: wrap; align-items: stretch; }
  .view.area > #aRooms .btn { height: 32px; padding: 0 10px; font-size: 13px; width: 100%; }
  .view.area > #aRooms .hint { display: none; }
  .view.area > #aRooms { grid-column: 1; grid-row: 1 / span 4; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 128px); }
  .view.area > #aEmpty { grid-column: 2 / span 2; grid-row: 1; }
  .view.area > #aSurf { grid-column: 2; grid-row: 1 / span 3; }
  .view.area > #aProf { grid-column: 2; grid-row: 3; }
  .view.area > #aWork { grid-column: 3; grid-row: 1 / span 2; }
  .view.area > #aRes { grid-column: 3; grid-row: 3; }
}

@media (max-width: 520px) {

}
@media (prefers-reduced-motion: reduce) { .toast, .chev svg, .cv svg { transition: none; } }

// Линейный раскрой (труба, брус, уголок): best-fit decreasing с учётом пропила
function cutLinear(L, pieces, kerf) {
  const list = [];
  const tooLong = [];
  pieces.forEach(p => {
    for (let i = 0; i < p.qty; i++) (p.len > L ? tooLong : list).push(p.len);
  });
  list.sort((a, b) => b - a);
  const bins = [];
  list.forEach(p => {
    let best = -1, bestLeft = Infinity;
    bins.forEach((b, i) => {
      const left = L - (b.used + p);
      if (left >= 0 && left < bestLeft) { bestLeft = left; best = i; }
    });
    if (best < 0) { bins.push({ items: [], used: 0 }); best = bins.length - 1; }
    bins[best].items.push(p);
    bins[best].used += p + kerf;
  });
  bins.forEach(b => {
    b.rest = Math.max(0, L - b.used);
    if (b.rest < 1) b.rest = 0;
  });
  const total = list.reduce((s, x) => s + x, 0);
  const restSum = bins.reduce((s, b) => s + b.rest, 0);
  return {
    kind: 'linear', stockLen: L, count: bins.length, bins, tooLong,
    pieceCount: list.length, usedLen: total, restLen: restSum,
    maxRest: bins.reduce((m, b) => Math.max(m, b.rest), 0),
    wastePct: bins.length ? (1 - total / (bins.length * L)) * 100 : 0
  };
}

// Листовой раскрой (guillotine): несколько эвристик, выбираем лучшую
function cutSheets(W, H, pieces, kerf, rotate) {
  const items = [];
  const tooBig = [];
  pieces.forEach(p => {
    const fits = (p.w <= W && p.h <= H) || (rotate && p.h <= W && p.w <= H);
    for (let i = 0; i < p.qty; i++) (fits ? items : tooBig).push({ w: p.w, h: p.h });
  });
  const orders = [
    (a, b) => b.w * b.h - a.w * a.h,
    (a, b) => Math.max(b.w, b.h) - Math.max(a.w, a.h),
    (a, b) => b.h - a.h || b.w - a.w,
    (a, b) => b.w - a.w || b.h - a.h
  ];
  let best = null;
  orders.forEach(ord => [0, 1].forEach(mode => {
    const r = packSheets(W, H, items.slice().sort(ord), kerf, rotate, mode);
    const key = [r.sheets.length, -r.maxFree];
    if (!best || key[0] < best.key[0] || (key[0] === best.key[0] && key[1] < best.key[1])) {
      best = r; best.key = key;
    }
  }));
  if (!best) best = packSheets(W, H, [], kerf, rotate, 0);
  const pieceArea = items.reduce((s, p) => s + p.w * p.h, 0);
  const sheetArea = best.sheets.length * W * H;
  best.sheets.forEach(s => { s.free = s.free.filter(f => f.w >= 20 && f.h >= 20); });
  return {
    kind: 'sheet', W, H, count: best.sheets.length, sheets: best.sheets, tooBig,
    pieceCount: items.length, usedArea: pieceArea, restArea: sheetArea - pieceArea,
    wastePct: sheetArea ? (1 - pieceArea / sheetArea) * 100 : 0,
    maxFree: best.maxFree
  };
}

function packSheets(W, H, items, kerf, rotate, mode) {
  const sheets = [];
  const newSheet = () => { const s = { placed: [], free: [{ x: 0, y: 0, w: W, h: H }] }; sheets.push(s); return s; };
  items.forEach(it => {
    let best = null;
    sheets.forEach((s, si) => s.free.forEach((f, fi) => {
      [[it.w, it.h, false], [it.h, it.w, true]].forEach(([w, h, rot]) => {
        if (rot && (!rotate || it.w === it.h)) return;
        if (w > f.w || h > f.h) return;
        const score = mode === 0 ? Math.min(f.w - w, f.h - h) * 1e6 + (f.w * f.h - w * h) : (f.w * f.h - w * h);
        if (!best || score < best.score) best = { si, fi, w, h, rot, score };
      });
    }));
    let s;
    if (!best) {
      s = newSheet();
      const f = s.free[0];
      let w = it.w, h = it.h, rot = false;
      if (w > f.w || h > f.h) { w = it.h; h = it.w; rot = true; }
      best = { si: sheets.length - 1, fi: 0, w, h, rot };

    const f = s.free.splice(best.fi, 1)[0];
    s.placed.push({ x: f.x, y: f.y, w: best.w, h: best.h, rot: best.rot });

    const A = [
      rw > 0 ? { x: f.x + best.w + kerf, y: f.y, w: rw, h: best.h } : null,
      bh > 0 ? { x: f.x, y: f.y + best.h + kerf, w: f.w, h: bh } : null
    ].filter(Boolean);
    const B = [
      rw > 0 ? { x: f.x + best.w + kerf, y: f.y, w: rw, h: f.h } : null,
      bh > 0 ? { x: f.x, y: f.y + best.h + kerf, w: best.w, h: bh } : null
    ].filter(Boolean);
    const big = a => a.reduce((m, r) => Math.max(m, r.w * r.h), 0);

  });

  sheets.forEach(s => s.free.forEach(f => { maxFree = Math.max(maxFree, f.w * f.h); }));
  return { sheets, maxFree };
}

далить комнату":["Delete room","Raum löschen","Supprimer la pièce","Eliminar estancia"],"Удалить размер":["Delete size","Größe löschen","Supprimer la taille","Eliminar tamaño"],"Фанера":["Plywood","Sperrholz","Contreplaqué","Contrachapado"],"Авто":["Auto","Auto","Auto","Auto"],"Автоматическая раскладка начинается от левого нижнего угла. Включите ручную, чтобы сдвинуть сетку, повернуть листы или плитку и задать шов.":["Automatic layout starts from the bottom left corner. Turn on manual layout to shift the grid, rotate sheets or tiles and set the joint.","Die automatische Verlegung beginnt an der linken unteren Ecke. Schalten Sie die manuelle ein, um das Raster zu verschieben, Platten oder Fliesen zu drehen und die Fuge festzulegen.","Le calepinage automatique commence au coin inférieur gauche. Activez le calepinage manuel pour décaler la grille, tourner plaques ou carreaux et régler le joint.","La colocación automática empieza en la esquina inferior izquierda. Active la manual para desplazar la cuadrícula, girar planchas o baldosas y fijar la junta."],"Алюминиевый профиль":["Aluminium profile","Aluminiumprofil","Profilé aluminium","Perfil de aluminio"],"Библиотека и корзина хранятся в этом браузере. Скопируйте данные, чтобы перенести их на другое устройство или не потерять при очистке браузера.":["The library and cart are stored in this browser. Copy the data to move it to another device or not lose it when clearing the browser.","Bibliothek und Warenkorb werden in diesem Browser gespeichert. Kopieren Sie die Daten, um sie auf ein anderes Gerät zu übertragen oder beim Leeren des Browsers nicht zu verlieren.","La bibliothèque et le panier sont stockés dans ce navigateur. Copiez les données pour les transférer sur un autre appareil ou ne pas les perdre en vidant le navigateur.","La biblioteca y el carrito se guardan en este navegador. Copie los datos para pasarlos a otro dispositivo o no perderlos al limpiar el navegador."],"Библиотека помещений":["Rooms library","Raumbibliothek","Bibliothèque de pièces","Biblioteca de estancias"],"Введите «Слева» или «Справа», либо просто потяните оранжевый профиль на чертеже (мышью можно взяться за любое место стены): сдвигается вся сетка, ручная расстановка включится сама. Без ручной расстановки профили идут автоматически от левого края. Оранжевые размеры показывают расстояние от краёв до крайних профилей и шаг.":["Enter “Left” or “Right”, or simply drag an orange profile on the drawing (with a mouse you can grab any place on the wall): the whole grid shifts and manual placement turns on by itself. Without manual placement the profiles run automatically from the left edge. Orange dimensions show the distance from the edges to the outer profiles and the spacing.","Geben Sie „Links“ oder „Rechts“ ein oder ziehen Sie einfach ein orangefarbenes Profil in der Zeichnung (mit der Maus können Sie die Wand an jeder Stelle greifen): Das ganze Raster verschiebt sich, die manuelle Anordnung schaltet sich von selbst ein. Ohne manuelle Anordnung laufen die Profile automatisch vom linken Rand. Orange Maße zeigen den Abstand von den Rändern zu den äußeren Profilen und den Achsabstand.","Saisissez « Gauche » ou « Droite », ou faites simplement glisser un profilé orange sur le dessin (à la souris, vous pouvez saisir n’importe quel endroit du mur) : toute la grille se décale et le placement manuel s’active tout seul. Sans placement manuel, les profilés partent automatiquement du bord gauche. Les cotes orange indiquent la distance entre les bords et les profilés extrêmes ainsi que l’entraxe.","Introduzca «Izquierda» o «Derecha», o simplemente arrastre un perfil naranja en el dibujo (con el ratón puede agarrar cualquier punto de la pared): se desplaza toda la cuadrícula y la colocación manual se activa sola. Sin colocación manual los perfiles van automáticamente desde el borde izquierdo. Las cotas naranjas muestran la distancia de los bordes a los perfiles extremos y la separación."],"Вернуть стандартные материалы":["Restore default materials","Standardmaterialien wiederherstellen","Rétablir les matériaux standard","Restaurar materiales estándar"],"Вертикально":["Vertical","Vertikal","Verticalement","Verticalmente"],"Включите «Каркас из профиля» в нужной стене, полу или потолке, и профиль попадёт в расчёт.":["Turn on “Profile frame” in the needed wall, floor or ceiling and the profile will be included in the calculation.","Schalten Sie „Profilrahmen“ in der gewünschten Wand, im Boden oder in der Decke ein, dann fließt das Profil in die Berechnung ein.","Activez « Ossature en profilés » dans le mur, le sol ou le plafond voulu et le profilé sera pris en compte dans le calcul.","Active «Estructura de perfiles» en la pared, suelo o techo deseado y el perfil entrará en el cálculo."],"Всего профиля":["Total profile","Profil gesamt","Total profilés","Total de perfil"],"Выберите стену, пол или потолок: откроется его рабочее окно.":["Choose a wall, floor or ceiling: its work window will open.","Wählen Sie eine Wand, den Boden oder die Decke: Das Arbeitsfenster öffnet sich.","Choisissez un mur, le sol ou le plafond : sa fenêtre de travail s’ouvrira.","Elija una pared, el suelo o el techo: se abrirá su ventana de trabajo."],"Высота потолков":["Ceiling height","Deckenhöhe","Hauteur sous plafond","Altura de techos"],"Горизонтально":["Horizontal","Horizontal","Horizontalement","Horizontalmente"],"Горизонтальные профили":["Horizontal profiles","Horizontale Profile","Profilés horizontaux","Perfiles horizontales"],"Горизонтальный профиль":["Horizontal profile","Horizontales Profil","Profilé horizontal","Perfil horizontal"],"Горизонтальных профилей":["Horizontal profiles","Horizontale Profile","Profilés horizontaux","Perfiles horizontales"],"Двери и окна":["Doors and windows","Türen und Fenster","Portes et fenêtres","Puertas y ventanas"],"Дверь":["Door","Tür","Porte","Puerta"],"Дверь или окно":["Door or window","Tür oder Fenster","Porte ou fenêtre","Puerta o ventana"],"Деталей":["Parts","Teile","Pièces","Piezas"],"Детали, на которые резать":["Parts to cut into","Zuzuschneidende Teile","Pièces à découper","Piezas a cortar"],"Длину стены можно изменить: соседняя стена изменится так, чтобы контур остался замкнутым.":["You can change the wall length: the neighbouring wall will change so that the outline stays closed.","Sie können die Wandlänge ändern: Die Nachbarwand passt sich an, damit die Kontur geschlossen bleibt.","Vous pouvez modifier la longueur du mur : le mur voisin changera pour que le contour reste fermé.","Puede cambiar la longitud de la pared: la pared contigua cambiará para que el contorno siga cerrado."],"Добавить в «Площадь»":["Add to “Area”","Zu „Fläche“ hinzufügen","Ajouter à « Surface »","Añadir a «Superficie»"],"Добавить деталь":["Add part","Teil hinzufügen","Ajouter une pièce","Añadir pieza"],"Добавить материал":["Add material","Material hinzufügen","Ajouter un matériau","Añadir material"],"Добавлено в корзину":["Added to cart","Zum Warenkorb hinzugefügt","Ajouté au panier","Añadido al carrito"],"Добавьте комнаты и выбирайте их в списке: справа открываются её стены, материалы и результат.":["Add rooms and pick them from the list: on the right you will see its walls, materials and result.","Fügen Sie Räume hinzu und wählen Sie sie in der Liste: Rechts öffnen sich Wände, Materialien und Ergebnis.","Ajoutez des pièces et choisissez-les dans la liste : à droite s’ouvrent ses murs, matériaux et résultat.","Añada estancias y elíjalas en la lista: a la derecha se abren sus paredes, materiales y resultado."],"Доска, брус":["Board, timber","Brett, Balken","Planche, madrier","Tabla, listón"],"Загрузить из поля":["Load from field","Aus Feld laden","Charger depuis le champ","Cargar desde el campo"],"Замкнуть":["Close outline","Kontur schließen","Fermer le contour","Cerrar contorno"],"Запас, %":["Reserve, %","Reserve, %","Réserve, %","Reserva, %"],"Из чего нарезаются подрезанные куски":["What the trimmed pieces are cut from","Woraus die zugeschnitte  чтобы ставить углы комнаты по порядку. Линии идут только вдоль клеток, под прямым углом. Чтобы замкнуть контур, нажмите на первую точку.":["Tap grid nodes to place the room corners in order. Lines follow the grid only, at right angles. To close the outline, tap the first point.","Tippen Sie auf Rasterpunkte, um die Raumecken der Reihe nach zu setzen. Linien verlaufen nur entlang des Rasters, im rechten Winkel. Zum Schließen der Kontur tippen Sie auf den ersten Punkt.","Touchez les nœuds de la grille pour placer les angles de la pièce dans l’ordre. Les lignes suivent seulement la grille, à angle droit. Pour fermer le contour, touchez le premier point.","Pulse los nodos de la cuadrícula para colocar las esquinas de la estancia en orden. Las líneas siguen solo la cuadrícula, en ángulo recto. Para cerrar el contorno pulse el primer punto."],"Нажмите на узел сетки, чтобы поставить первый угол.":["Tap a grid node to place the first corner.","Tippen Sie auf einen Rasterpunkt, um die erste Ecke zu setzen.","Touchez un nœud de la grille pour placer le premier angle.","Pulse un nodo de la cuadrícula para colocar la primera esquina."],"Назад":["Back","Zurück","Retour","Atrás"],"Название":["Name","Name","Nom","Nombre"],"Название комнаты":["Room name","Raumname","Nom de la pièce","Nombre de la estancia"],"Нарезать на части":["Cut into parts","In Teile schneiden","Découper en pièces","Cortar en piezas"],"Настроить помещение вручную":["Set up the room manually","Raum manuell einrichten","Configurer la pièce manuellement","Configurar la estancia manualmente"],"Начертить схему":["Draw a plan","Grundriss zeichnen","Dessiner un plan","Dibujar esquema"],"Новый материал":["New material","Neues Material","Nouveau matériau","Nuevo material"],"Новый размер":["New size","Neue Größe","Nouvelle taille","Nuevo tamaño"],"ОК, добавить комнату":["OK, add room","OK, Raum hinzufügen","OK, ajouter la pièce","OK, añadir estancia"],"Окно":["Window","Fenster","Fenêtre","Ventana"],"Остаток":["Remainder
