,"Jusqu’au bord inférieur, mm","Hasta el borde inferior, mm"],"Снизу, мм":["From the bottom, mm","Von unten, mm","Depuis le bas, mm","Desde abajo, mm"],"О приложении":["About the app","Über die App","À propos","Acerca de la app"],"Описание и возможности":["Description and features","Beschreibung und Funktionen","Description et fonctions","Descripción y funciones"],"Приложение считает, сколько листового материала и профиля нужно купить для ремонта, и показывает, как их нарезать с минимальными отходами.":["The app calculates how much sheet material and profile you need to buy for a renovation and shows how to cut it with minimal waste.","Die App berechnet, wie viel Plattenmaterial und Profil Sie für die Renovierung kaufen müssen, und zeigt, wie man es mit minimalem Verschnitt zuschneidet.","L’application calcule la quantité de matériaux en plaques et de profilés à acheter pour une rénovation et montre comment les découper avec un minimum de chutes.","La aplicación calcula cuánto material en planchas y perfil hay que comprar para una reforma y muestra cómo cortarlo con el mínimo desperdicio."],"Возможности":["Features","Funktionen","Fonctions","Funciones"],"Комнаты любой формы":["Rooms of any shape","Räume in beliebiger Form","Pièces de toute forme","Habitaciones de cualquier forma"],"Задайте длину, ширину и высоту или начертите контур по клеткам. Двери, окна и проёмы с точными размерами.":["Enter length, width and height or draw the outline on a grid. Doors, windows and openings with exact sizes.","Geben Sie Länge, Breite und Höhe ein oder zeichnen Sie den Grundriss im Raster. Türen, Fenster und Öffnungen mit genauen Maßen.","Saisissez la longueur, la largeur et la hauteur ou dessinez le contour sur une grille. Portes, fenêtres et ouvertures aux dimensions exactes.","Indique largo, ancho y alto o dibuje el contorno en una cuadrícula. Puertas, ventanas y huecos con medidas exactas."],"Материалы и профили":["Materials and profiles","Materialien und Profile","Matériaux et profilés","Materiales y perfiles"],"Листы, плитка, ламинат, доски и профили в библиотеке. Можно добавить свой материал, цвет и текстуру.":["Sheets, tiles, laminate, boards and profiles in the library. Add your own material, color and texture.","Platten, Fliesen, Laminat, Bretter und Profile in der Bibliothek. Eigenes Material, Farbe und Textur lassen sich hinzufügen.","Plaques, carrelage, stratifié, planches et profilés dans la bibliothèque. Ajoutez votre propre matériau, couleur et texture.","Planchas, baldosas, laminado, tablas y perfiles en la biblioteca. Puede añadir su propio material, color y textura."],"Каркас и раскладка":["Frame and layout","Unterkonstruktion und Verlegung","Ossature et calepinage","Estructura y distribución"],"Каркас из профиля с шагом, раскладка листов и плитки автоматически или вручную, шов и пропил.":["Profile frame with spacing, sheet and tile layout automatic or manual, joint and saw kerf.","Profilunterkonstruktion mit Abstand, Verlegung von Platten und Fliesen automatisch oder von Hand, Fuge und Schnittbreite.","Ossature en profilés avec entraxe, calepinage des plaques et du carrelage automatique ou manuel, joint et trait de scie.","Estructura de perfil con separación, distribución de planchas y baldosas automática o manual, junta y corte de sierra."],"Развёртка и 3D":["Unfolded walls and 3D","Abwicklung und 3D","Développé et 3D","Desarrollo y 3D"],"Каждая стена, пол и потолок крупно с размерами и расстояниями до проёмов, вся комната в объёме.":["Every wall, floor and ceiling in large view with dimensions and distances to openings, plus the whole room in 3D.","Jede Wand, der Boden und die Decke groß mit Maßen und Abständen zu Öffnungen, dazu der ganze Raum in 3D.","Chaque mur, le sol et le plafond en grand avec cotes et distances aux ouvertures, et toute la pièce en 3D.","Cada pared, el suelo y el techo en grande con medidas y distancias a los huecos, y toda la habitación en 3D."],"Расчёт раскроя":["Cutting calculation","Zuschnittberechnung","Calcul de découpe","Cálculo de corte"],"Сколько листов и профиля купить, как их нарезать, что останется и сколько уйдёт в отходы.":["How many sheets and profiles to buy, how to cut them, what is left over and how much becomes waste.","Wie viele Platten und Profile zu kaufen sind, wie man sie zuschneidet, was übrig bleibt und wie viel Verschnitt entsteht.","Combien de plaques et de profilés acheter, comment les découper, ce qui reste et la part de chutes.","Cuántas planchas y perfiles comprar, cómo cortarlos, qué sobra y cuánto se pierde como desperdicio."],"Корзина и экспорт":["Cart and export","Warenkorb und Export","Panier et export","Cesta y exportación"],"Итоговый список покупок по комнатам. Копирование списка, экспорт проекта в PDF, JPG и Word.":["A final shopping list by room. Copy the list or export the project to PDF, JPG and Word.","Eine Einkaufsliste nach Räumen. Liste kopieren oder das Projekt als PDF, JPG und Word exportieren.","Une liste d’achats finale par pièce. Copie de la liste, export du projet en PDF, JPG et Word.","Una lista de compra final por habitación. Copie la lista o exporte el proyecto a PDF, JPG y Word."],"Сохраняйте комнаты в библиотеку и открывайте их снова.":["Save rooms to the library and open them again.","Speichern Sie Räume in der Bibliothek und öffnen Sie sie erneut.","Enregistrez les pièces dans la bibliothèque et rouvrez-les.","Guarde habitaciones en la biblioteca y ábralas de nuevo."],"Удобство":["Convenience","Komfort","Confort d’utilisation","Comodidad"],"Пять языков, миллиметры, сантиметры, метры и дюймы, тёмная и светлая тема. Работает без интернета, данные хранятся на этом устройстве.":["Five languages, millimeters, centimeters, meters and inches, dark and light themes. Works offline, data is stored on this device.","Fünf Sprachen, Millimeter, Zentimeter, Meter und Zoll, dunkles und helles Design. Funktioniert offline, die Daten bleiben auf diesem Gerät.","Cinq langues, millimètres, centimètres, mètres et pouces, thème sombre et clair. Fonctionne hors ligne, les données restent sur cet appareil.","Cinco idiomas, milímetros, centímetros, metros y pulgadas, tema oscuro y claro. Funciona sin conexión y los datos se guardan en este dispositivo."],"Применить":["Apply","Anwenden","Appliquer","Aplicar"],"Все":["All","Alle","Toutes","Todas"],"Пол и потолок":["Floor & ceiling","Boden & Decke","Sol et plafond","Suelo y techo"],"Применить к стенам":["Apply to walls","Auf Wände anwenden","Appliquer aux murs","Aplicar a las paredes"],"Применить к потолку и полу":["Apply to ceiling and floor","Auf Decke und Boden anwenden","Appliquer au plafond et au sol","Aplicar a techo y suelo"],"Материал применён к стенам":["Material applied to walls","Material auf Wände angewendet","Matériau appliqué aux murs","Material aplicado a las paredes"],"Материал применён к потолку и полу":["Material applied to ceiling and floor","Material auf Decke und Boden angewendet","Matériau appliqué au plafond et au sol","Material aplicado a techo y suelo"],"Для этой поверхности материал не считается.":["The material is not counted for this surface.","Für diese Fläche wird kein Material gezählt.","Le matériau n’est pas compté pour cette surface.","No se cuenta material para esta superficie."],"По раскладке: целых":["By layout: whole","Nach Layout: ganze","Par calepinage : entières","Por distribución: enteras"],"По раскладке: подрезанных":["By layout: trimmed","Nach Layout: zugeschnittene","Par calepinage : coupées","Por distribución: recortadas"],"В корзину попадёт вся комната.":["The whole room will go to the cart.","Der ganze Raum kommt in den Warenkorb.","Toute la pièce ira dans le panier.","Toda la habitación irá al carrito."],"Вертикальные профили: двигать по отдельности":["Vertical profiles: move one by one","Vertikale Profile: einzeln verschieben","Profilés verticaux : déplacer un par un","Perfiles verticales: mover uno por uno"],"Горизонтальные профили: двигать по отдельности":["Horizontal profiles: move one by one","Horizontale Profile: einzeln verschieben","Profilés horizontaux : déplacer un par un","Perfiles horizontales: mover uno por uno"],"Удалить профиль":["Delete profile","Profil löschen","Supprimer le profilé","Eliminar perfil"],"Вертикальный профиль":["Vertical profile","Vertikales Profil","Profilé vertical","Perfil vertical"],"Вертикальные профили двигаются по отдельности: потяните любой профиль на чертеже или введите его положение от левого края. Корзина рядом с профилем убирает его, «Вертикальный профиль» добавляет новый.":["Vertical profiles move one by one: drag any profile on the drawing or type its position from the left edge. The trash button next to a profile removes it, “Vertical profile” adds a new one.","Vertikale Profile bewegen sich einzeln: Ziehen Sie ein Profil auf der Zeichnung oder geben Sie seine Position vom linken Rand ein. Der Papierkorb neben einem Profil entfernt es, „Vertikales Profil“ fügt ein neues hinzu.","Les profilés verticaux se déplacent un par un : faites glisser un profilé sur le dessin ou saisissez sa position depuis le bord gauche. La corbeille à côté d’un profilé le retire, « Profilé vertical » en ajoute un.","Los perfiles verticales se mueven uno por uno: arrastre cualquier perfil en el dibujo o escriba su posición desde el borde izquierdo. La papelera junto a un perfil lo quita; «Perfil vertical» añade uno nuevo."],"Показать все поверхности":["Show all surfaces","Alle Flächen anzeigen","Afficher toutes les surfaces","Mostrar todas las superficies"],"Что показывать и класть в корзину":["What to show and put in the cart","Was anzeigen und in den Warenkorb legen","Quoi afficher et mettre au panier","Qué mostrar y poner en el carrito"],"Вся комната":["Whole room","Ganzer Raum","Toute la pièce","Toda la habitación"],"Выбранная стена":["Selected wall","Gewählte Wand","Mur sélectionné","Pared seleccionada"],"Выбранная поверхность":["Selected surface","Gewählte Fläche","Surface sélectionnée","Superficie seleccionada"],"Эта стена async function exSave(name, blob) {
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename: name, data: blob }); toast('Файл готов: ' + name); }
    catch (e) { if (!(e && e.code === 'declined')) toast('Не удалось сохранить файл'); }
    return;
  }
  if (window.RaskroyAndroid && window.RaskroyAndroid.saveFile) { /* приложение для Android: системное окно «Сохранить как» */
    try {
      const b64 = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => no(r.error); r.readAsDataURL(blob); });
      const ext = (name.match(/\.([a-z0-9]+)$/i) || [])[1] || '', MT = { pdf: 'application/pdf', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', zip: 'application/zip', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', txt: 'text/plain', csv: 'text/csv', json: 'application/json', html: 'text/html' };
      const safe = String(name || '').replace(/[\\/:*?"<>|]/g, '_').trim() || 'raskroy';
      window.RaskroyAndroid.saveFile(safe, MT[ext.toLowerCase()] || blob.type || 'application/octet-stream', b64);
    } catch (e) { toast('Не удалось сохранить файл'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  toast('Файл готов: ' + name);
}
const exName = () => 'raskroy-' + new Date().toISOString().slice(0, 10);
let exBusy = false;
async function exRun(kind) {
  if (exBusy) return;
  if (!S.cart.length) { toast('Корзина пуста'); return; }
  const doc = exBuild(); if (!doc) { toast('Отметьте галочкой хотя бы одну комнату.'); return; }
  exBusy = true; toast('Готовлю документ…');
  try {
    if (kind === 'docx') { await exSave(exName() + '.docx', await exDocx(doc)); return; }
    const svgs = exLayout(doc), pages = [];
    if (window.__exdbg) window.__exdbg(svgs);
    for (const s of svgs) {
      const blob = await exRaster(s, EXP.W, EXP.H, 2, 'image/jpeg', .92);
      pages.push({ blob, jpg: await exBytes(blob), w: Math.round(EXP.W * 2), h: Math.round(EXP.H * 2) });
    }
    if (kind === 'pdf') await exSave(exName() + '.pdf', exPdf(pages));
    else if (pages.length === 1) await exSave(exName() + '.jpg', pages[0].blob);
    else await exSave(exName() + '-jpg.zip', exZip(pages.map((p, i) => ({ name: `${exName()}-${String(i + 1).padStart(2, '0')}.jpg`, data: p.jpg }))));
  } catch (e) { toast('Не удалось подготовить документ'); if (typeof console !== 'undefined') console.error(e); }
  finally { exBusy = false; }
}
function expAct(name) {
  if (name === 'exp_toggle') { ui.expOpen = !ui.expOpen; renderCart(); return; }
  if (name === 'exp_pdf') exRun('pdf'); else if (name === 'exp_jpg') exRun('jpg'); else if (name === 'exp_docx') exRun('docx');
}

const crKey = it => it.roomId || (it.room ? 'n:' + it.room : '_');
function crList() {
  const m = new Map();
  S.cart.forEach(it => {
    const k = crKey(it), r = it.roomId && S.plan.list.find(x => x.id === it.roomId);

/* количество позиции: расчётное или заданное вручную для этой комнаты */
const effN = it => (it.qty != null && it.qty >= 0 ? it.qty : it.count);
const effF = it => (it.fq != null && it.fq >= 0 ? it.fq : it.frame.count);
const itemKey = it => gKey(it.typeId, sizeText(it.kind, it.stock), it.spec);
function cartTotals(items) {
  const g = {};
  (items || S.cart).forEach(it => {
    const k = gKey(it.typeId, sizeText(it.kind, it.stock), it.spec);
    const gg = (g[k] = g[k] || { key: k, name: it.name, spec: it.spec, size: sizeText(it.kind, it.stock), n: 0, b: 0 });
    gg.n += effN(it); gg.b += it.count;

    if (it.kind === 'area' && it.frame && it.frame.count) {
      const f = it.frame, fs = sizeText('linear', { len: f.len }), fk = gKey(f.typeId, fs, f.spec);
      const fg = (g[fk] = g[fk] || { key: fk, name: f.name, spec: f.spec || '', size: fs, n: 0, b: 0 });
      fg.n += effF(it); fg.b += f.count;

/* количество по позициям согласовано с «Итого купить»: если итог изменён вручную,
   он делится между позициями пропорционально их расчёту (по наибольшему остатку) */
function cartShare(vis, global) {
  const flt = !global && crFiltered(), list = flt ? vis : S.cart, tot = cartTotals(flt ? vis : null), parts = {};
  const put = (k, id, c, b) => (parts[k] = parts[k] || []).push({ id, c, b: b != null ? b : c });
  list.forEach(it => {
    put(gKey(it.typeId, sizeText(it.kind, it.stock), it.spec), it.id, effN(it), it.count);
    if (it.kind === 'area' && it.frame && it.frame.count) { const f = it.frame; put(gKey(f.typeId, sizeText('linear', { len: f.len }), f.spec), it.id + '#f', effF(it), f.count); }
  });
  const out = { c: {}, m: {} };
  Object.keys(parts).forEach(k => {
    const ps = parts[k], base = ps.reduce((s, p) => s + p.c, 0), want = tot[k] ? tot[k].n : base;
    let res = ps.map(p => p.c);
    if (want !== base) {
      if (!base) res = ps.map((p, i) => (i ? 0 : want));
      else {
        res = ps.map(p => Math.floor(p.c * want / base));
        let rest = want - res.reduce((s, x) => s + x, 0);
        ps.map((p, i) => [i, p.c * want / base - res[i]]).sort((a, b) => b[1] - a[1] || a[0] - b[0]).forEach(([i]) => { if (rest > 0) { res[i]++; rest--; } });
      }
    }

    case 'ntSave': {
      const n = ui.newType, name = n.name.trim();

      const nid = 'c' + uid();
      S.types.push({ id: nid, name, kind: n.kind, cat: n.kind === 'sheet' ? 'sheet' : 'frame', icon: n.icon, tex: n.tex, custom: true });
      ui.newType = null; ui.typesOpen = false; selectType(nid); renderCalc(); toast('Материал добавлен. Текстура и цвет задаются в библиотеке'); break;
    }
    case 'pickStock': { const s = S.stock.find(x => x.id === id); if (s) { applyStock(s); renderSize(); renderResult(); } break; }
    case 'saveStock': {
      const t = curType(); if (!t || matchStock()) return;

    }
    case 'addRow': d.rows.push(blankRow()); renderRows(); renderResult(); { const r = document.querySelectorAll('.row'); const l = r[r.length - 1]; if (l) l.querySelector('input').focus(); } break;
    case 'delRow': if (d.rows.length > 1) d.rows.splice(+el.dataset.i, 1); else d.rows = [blankRow()]; renderRows(); renderResult(); break;
    case 'addCart': addCart(); break;
    case 'cancelEdit': d.editing = null; renderResult(); break;
    case 'useStock': { const s = S.stock.find(x => x.id === id); if (!s) return; const t = S.types.find(x => x.id === s.typeId); if (t) { selectType(t.id); applyStock(s); } location.hash = 'calc'; renderAll(); break; }
    case 'delStock': S.stock = S.stock.filter(x => x.id !== id); if (d.stockId === id) d.stockId = null; renderLibrary(); break;
    case 'delType': delete ui.libOpen[id]; S.fav = favSet().filter(x => x !== id); S.types = S.types.filter(x => x.id !== id); S.stock = S.stock.filter(x => x.typeId !== id); if (d.typeId === id) { if (S.types.length) selectType(S.types[0].id); else { d.typeId = null; d.stockId = null; } } renderLibrary(); toast('Материал удалён из библиотеки'); break;
    case 'restoreDefaults': {
      let n = 0;
      DEF_TYPES.forEach(x => { if (!S.types.find(t => t.id === x.id)) { S.types.push(clone(x)); n++; } });
      DEF_STOCK.forEach(x => { if (!S.stock.find(s => s.id === x.id) && S.types.find(t => t.id === x.typeId)) S.stock.push(clone(x)); });
      if (!curType() && S.types.length) selectType(S.types[0].id);
      renderLibrary(); toast(n ? `Возвращено материалов: ${n}` : 'Все стандартные материалы уже есть'); break;
    }
    case 'copyData': {
      const json = JSON.stringify(S); ui.backup = json;
      copyText(json, 'Данные скопированы').then(ok => { if (!ok) { const b = $('#backup'); b.value = json; b.select(); } });
      return;
    }
    case 'loadData': {
      try {
        const o = JSON.parse(ui.backup);
        if (!o || !Array.isArray(o.types) || !Array.isArray(o.stock) || !Array.isArray(o.cart) || !o.draft) throw new Error('bad');
        S = migrate(o); ui.backup = ''; applyTheme(); renderAll(); toast('Данные загружены');
      } catch (e) { toast('Не удалось прочитать данные'); }
      return;
    }
    case 'editItem': {
      const it = S.cart.find(x => x.id === id); if (!it) return;
      if (!S.types.find(x => x.id === it.typeId)) { toast('Этот материал удалён из библиотеки'); return; }
      if (it.kind === 'area' || it.snap) { restoreArea(it); return; }
      d.typeId = it.typeId; d.spec = it.spec; d.kerf = String(it.kerf); d.rotate = it.rotate !== false; d.editing = it.id; d.man = it.man ? clone(it.man) : { on: false, ns: 1, pl: {} }; ui.manSel = null;
      if (it.kind === 'linear') { d.a = toStr(it.stock.len); d.b = ''; d.rows = it.pieces.map(p => ({ a: toStr(p.len), b: '', q: String(p.qty) })); }
      else { d.a = toStr(it.stock.w); d.b = toStr(it.stock.h); d.rows = it.pieces.map(p => ({ a: toStr(p.w), b: toStr(p.h), q: String(p.qty) })); }
      const m = matchStock(); d.stockId = m ? m.id : null;
      location.hash = 'calc'; renderAll(); break;
    }
    case 'delItem': S.cart = S.cart.filter(x => x.id !== id); if (d.editing === id) d.editing = null; renderHead(); renderCart(); toast('Удалено из корзины'); break;
    case 'clearCart': S.cart = []; S.cartQty = {}; d.editing = null; renderHead(); renderCart(); break;
    case 'copyCart': copyText(cartText(), 'Список скопирован'); return;

}
function onInput(el) {
  const d = S.draft, k = el.dataset.in;
  if (k && k.startsWith('a_')) { areaInput(k, el); return; }
  if (k === 'unit') {
    const from = S.unit, to = el.value;
    d.a = convStr(d.a, from, to); d.b = convStr(d.b, from, to);
    d.rows.forEach(r => { r.a = convStr(r.a, from, to); r.b = convStr(r.b, from, to); });
    S.plan.list.forEach(r => areaConvert(r.area, from, to));
    if (ui.sk) ui.sk.h = convStr(ui.sk.h, from, to);
    if (ui.start) ['l', 'w', 'h'].forEach(q => { ui.start[q] = convStr(ui.start[q], from, to); });
    S.unit = to; renderAll(); save(); return;
  }
  if (k && k.startsWith('st_')) {
    const v = startVals(), f = k.slice(3);
    if (f === 'floor' || f === 'ceil') v[f] = el.checked; else { v[f] = el.value; if (el.classList && f !== 'name') el.classList.toggle('bad', !isFinite(mm0(el.value))); }
    return;
  }
  if (k && k.startsWith('sk_')) {
    const v = skState(), f = k.slice(3);
    if (f === 'len') {
      const mm = mm0(el.value), ok = isFinite(mm) && skSetLen(+el.dataset.i, mm); if (el.classList) el.classList.toggle('bad', !ok);
      if (ok) { const b = $('#skBox'); if (b) b.innerHTML = skSvg(); skSyncLens(el); }
      return;
    }
    if (f === 'floor' || f === 'ceil') v[f] = el.checked; else { v[f] = el.value; if (f === 'h') { if (el.classList) el.classList.toggle('bad', !isFinite(mm0(el.value))); const l = $('#skList'); if (l) l.innerHTML = skWallList(); } }
    return;
  }
  if (k === 'ntName') { ui.newType.name = el.value; return; }
  if (k === 'lnName') { ui.libNew.name = el.value; return; }
  if (k === 'lsz') { libSz(el.dataset.id)[el.dataset.f] = el.value; return; }
  if (k === 'libName') {
    const t = S.types.find(x => x.id === el.dataset.id); if (!t) return;
    const nm = el.value.trim(); if (!nm) return;
    t.name = nm; S.cart.forEach(it => { if (it.typeId === t.id) it.name = nm; });
    const hb = $(`[data-act="toggleLib"][data-id="${t.id}"] b`); if (hb) hb.textContent = nm;
    save(); return;
  }
  if (k === 'libCatSel') {
    const t = S.types.find(x => x.id === el.dataset.id); if (!t) return;
    t.cat = el.value; ui.libCat = t.cat; ui.libOpen[t.id] = true; renderLibrary(); save();
    const r = $('#lb-' + t.id); if (r && r.scrollIntoView) r.scrollIntoView({ block: 'center' });
    toast('Материал перенесён: ' + (CATS.find(c => c[0] === t.cat) || [])[1]); return;
  }
  if (k === 'typeColor') {
    /* пока выбирают цвет, перерисовывать нельзя: окно выбора закроется. Обновляем только превью. */
    const t = S.types.find(x => x.id === el.dataset.id); if (t) { t.color = el.value; syncCart(t); }
    const box = el.closest && el.closest('.texbox'); if (box) box.style.setProperty('--c', el.value);
    save(); return;
  }
  if (k === 'backup') { ui.backup = el.value; return; }
  if (k === 'a' || k === 'b' || k === 'spec') { d[k] = el.value; if (k !== 'spec') el.classList.toggle('bad', el.value !== '' && !(num(el.value) > 0)); refreshSizeMeta(); }
  else if (k === 'row') { d.rows[+el.dataset.i][el.dataset.f] = el.value; el.classList.toggle('bad', el.value !== '' && !(num(el.value) > 0)); }
  else if (k === 'kerf') d.kerf = el.value;
  else if (k === 'rotate') d.rotate = el.checked;
  renderResult(); save();
}

/* нажатая кнопка коротко подсвечивается; после перерисовки подсветка возвращается на новую кнопку */
document.addEventListener('click', e => {
  const t = e.target && e.target.closest ? e.target.closest('button[data-act], .btn') : null;
  if (!t || t.disabled) return;
  const d = t.dataset || {}, sel = d.act ? '[data-act="' + d.act + '"]' + (d.id ? '[data-id="' + d.id + '"]' : '') + (d.k !== undefined ? '[data-k="' + d.k + '"]' : '') + (d.i !== undefined ? '[data-i="' + d.i + '"]' : '') : null;
  setTimeout(() => {
    const n = sel ? document.querySelector(sel) : t;
    if (!n || !n.classList) return;
    n.classList.remove('tapfx'); void n.offsetWidth; n.classList.add('tapfx');
    setTimeout(() => { n.classList.remove('tapfx'); }, 600);
  }, 0);
}, true);
document.addEventListener('click', e => {
  if (isoMoved) { isoMoved = false; return; }
  const sv = e.target.closest('#skSvg'); if (sv && sv.getBoundingClientRect) { skAdd(skNode(e, sv)); return; }
  const el = e.target.closest('[data-act]'); if (el) act(el.dataset.act, el);
});
document.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const sv = e.target.closest && e.target.closest('#skSvg'), k = ui.sk; if (!k || !sv || !sv.getBoundingClientRect || k.closed) return;
  const n = skNode(e, sv); if (k.hover && k.hover[0] === n[0] && k.hover[1] === n[1]) return; k.hover = n; const b = $('#skBox'); if (b) b.innerHTML = skSvg();
});
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.in) onInput(e.target); });
document.addEventListener('change', e => {
  const cr = e.target.dataset && e.target.dataset.cr;
  if (cr) {
    const all = crList(), cur = {}; all.forEach(r => { cur[r.key] = crOn(r.key); });
    cur[cr] = e.target.checked;
    ui.cartRooms = all.every(r => cur[r.key]) ? null : cur;
    renderCart(); return;
  }
  const cq = e.target.dataset && e.target.dataset.cq;
  if (cq) {
    const flt = crFiltered(), g = cartTotals(flt ? crVisible() : null)[cq]; if (!g) return;
    const v = Math.floor(num(e.target.value)), nv = isFinite(v) && v >= 0 ? Math.min(9999, v) : g.calc;
    if (flt) { setVisTotal(g.key, nv); renderCart(); save(); return; }
    clearItemQty(g.key);
    if (nv === g.calc) delete S.cartQty[g.key]; else S.cartQty[g.key] = nv;
    renderCart(); save(); return;
  }
  const k = e.target.dataset && e.target.dataset.in;
  if (k === 'typeColor') renderAll();
  const ta = e.target.dataset && e.target.dataset.tact;
  if (ta) act(ta, { dataset: { id: e.target.dataset.id, k: e.target.value } });
});
document.addEventListener('focusout', e => { if (e.target && e.target.dataset && e.target.dataset.in === 'a_sname' && ui.renSurf) renSurfEnd(true); });
document.addEventListener('focusout', e => { if (e.target && e.target.dataset && e.target.dataset.in === 'a_rname' && ui.renRoom) renRoomEnd(true); });
document.addEventListener('keydown', e => {
  const t = e.target;
  if (tabNow() === 'guide' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName || '')) { gstep(e.key === 'ArrowRight' ? 1 : -1); return; }
  if (t.dataset && t.dataset.in === 'a_sname') { if (e.key === 'Enter') { e.preventDefault(); renSurfEnd(true); } else if (e.key === 'Escape') { e.preventDefault(); renSurfEnd(false); } return; }
  if (t.dataset && t.dataset.in === 'a_rname') { if (e.key === 'Enter') { e.preventDefault(); renRoomEnd(true); } else if (e.key === 'Escape') { e.preventDefault(); renRoomEnd(false); } return; }
  if (e.key !== 'Enter' || !t.dataset || t.dataset.in !== 'row' || t.dataset.f !== 'q') return;
  e.preventDefault();
  const i = +t.dataset.i;
  if (i === S.draft.rows.length - 1) act('addRow', t);
  else { const n = document.querySelectorAll('.row')[i + 1]; if (n) n.querySelector('input').focus(); }
});
/* Ctrl+Z — отменить, Ctrl+Y или Ctrl+Shift+Z — вернуть (по физической клавише, работает и в русской раскладке) */
document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const z = e.code === 'KeyZ' || e.key === 'z' || e.key === 'Z', y = e.code === 'KeyY' || e.key === 'y' || e.key === 'Y';
  if (!z && !y) return;
  e.preventDefault(); e.stopPropagation();
  const redo = y || e.shiftKey;
  if (!redo && tabNow() === 'sketch' && ui.sk && (ui.sk.pts.length || ui.sk.closed)) { act('sk_undo', { dataset: {} }); return; }
  const ae = document.activeElement; if (ae && ae !== document.body && ae.blur) ae.blur();
  if (!(redo ? histRedo() : histUndo())) { toast(redo ? 'Нечего возвращать' : 'Нечего отменять'); return; }
  const A = S.area, has = id => !!(id && A.surfaces.some(s => s.id === id));
  if (!has(ui.devSel)) ui.devSel = null;
  if (!has(ui.surfSel)) ui.surfSel = null;
  ui.selOp = null; ui.renSurf = null; ui.renRoom = null;
  applyTheme(); renderAll();
  toast(redo ? 'Возвращено' : 'Отменено');
}, true);
/* свайп по слайду гайда */
let gx = null;
document.addEventListener('touchstart', e => { gx = e.target.closest && e.target.closest('#gslide') && e.touches && e.touches[0] ? e.touches[0].clientX : null; }, { passive: true });
document.addEventListener('touchend', e => { if (gx == null || !e.changedTouches || !e.changedTouches[0]) return; const dx = e.changedTouches[0].clientX - gx; gx = null; if (Math.abs(dx) > 50) gstep(dx < 0 ? 1 : -1); }, { passive: true });
/* при входе во вкладку «Площадь» рабочая область сразу показывает все стены */
